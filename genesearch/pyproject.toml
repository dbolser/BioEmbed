[project]
name = "genesearch"
version = "0.1.0"
description = "Type a gene, see its literature (PubMed + PubTator3 + Open Targets)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "duckdb",
    "pandas",
    "pyarrow",
    "bm25s",
    "PyStemmer",
    "torch>=2.14.1",
    "sentence-transformers>=6.1.0",
    "umap-learn>=0.5.12",
    "hdbscan>=0.8.44",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
