<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gene search</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #555; --line: #d8d8d8; --panel: #f4f5f7;
    --gene: #005a8c; --term-bg: #ffe39a; --term-line: #9a4a00; --cur: #00664a; --ep: #5b3a96; --focus: #0072b2;
  }
  body.cream { --bg: #fbf5e6; --panel: #f1e9d4; --line: #d9cfb6; }
  * { box-sizing: border-box; }
  html { font-size: 19px; }  /* rem = 19px; nothing on the page is smaller than .9rem (17px) */
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 1rem/1.65 "Atkinson Hyperlegible", Verdana, "DejaVu Sans", system-ui, sans-serif;
  }
  .wrap { max-width: 88rem; margin: 0 auto; padding: 0 1.2rem 4rem; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header .wrap { padding-top: .8rem; padding-bottom: .8rem; }
  form { display: flex; flex-wrap: wrap; gap: .6rem; align-items: end; }
  label { display: flex; flex-direction: column; font-size: .9rem; color: var(--muted); }
  input, select, button {
    font: inherit; font-size: 1rem; padding: .35rem .6rem; border: 1px solid #888; border-radius: 6px;
    background: #fff; color: var(--fg);
  }
  #gene { width: 12rem; } #term { width: 17rem; }
  button { cursor: pointer; background: #fff; }
  button.primary { background: var(--focus); color: #fff; border-color: var(--focus); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .hint { font-size: .9rem; color: var(--muted); }
  .linkish { border: none; background: none; padding: 0; color: var(--gene); text-decoration: underline; font-size: inherit; }
  .muted { color: var(--muted); }
  h1 { font-size: 1.7rem; margin: 1.2rem 0 .2rem; line-height: 1.3; }
  h1 .nm { font-weight: normal; }
  h2 { font-size: 1.2rem; margin: 1.6rem 0 .4rem; }
  a { color: var(--gene); }
  .card p { margin: .25rem 0; max-width: 70ch; }
  .choices button { display: block; width: 100%; text-align: left; margin: .35rem 0; padding: .5rem .8rem; }
  /* disease facets on the left, results on the right */
  .cols { display: grid; grid-template-columns: minmax(14rem, 19rem) minmax(0, 1fr); gap: 1.6rem; align-items: start; }
  @media (max-width: 56rem) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .facet { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: .6rem .7rem .7rem; margin-top: 1.4rem; }
  .facet h2 { font-size: 1.1rem; margin: 0; display: flex; gap: .5rem; align-items: center; }
  .facet .sub { font-size: .9rem; color: var(--muted); margin: .1rem 0 .5rem; line-height: 1.45; }
  .src { display: inline-block; border-radius: 5px; padding: 0 .4rem; font-size: .9rem; font-weight: bold; color: #fff; line-height: 1.5; }
  .src.ot { background: var(--cur); } .src.ep { background: var(--ep); }
  .dlist { list-style: none; padding: 0; margin: 0; }
  .dlist button {
    width: 100%; text-align: left; border: 1px solid transparent; background: transparent; font-size: .95rem; line-height: 1.4;
    padding: .25rem .45rem; border-radius: 6px; display: flex; gap: .8rem; justify-content: space-between;
  }
  .dlist button:hover { border-color: var(--line); background: var(--bg); }
  .facet.ot .dlist button[aria-pressed=true] { border: 2px solid var(--cur); background: var(--bg); font-weight: bold; }
  .facet.ep .dlist button[aria-pressed=true] { border: 2px solid var(--ep); background: var(--bg); font-weight: bold; }
  .dlist .any { font-style: italic; }
  .dlist button.zero { color: var(--muted); }
  .dlist .n { white-space: nowrap; color: var(--muted); font-size: .9rem; }
  details.more > summary { cursor: pointer; color: var(--gene); margin-top: .4rem; font-size: .95rem; }
  .bar { display: flex; flex-wrap: wrap; gap: .8rem 1.2rem; align-items: center; margin: .6rem 0; }
  .bar input[type=number] { width: 5.5rem; }
  .status { font-size: 1.05rem; margin-top: 1rem; }
  .note { background: var(--panel); border-left: 4px solid var(--term-line); padding: .4rem .8rem; max-width: 70ch; }
  /* tabs: List / Map / Map Explorer */
  .tabs { display: flex; gap: .4rem; margin-top: 1.4rem; border-bottom: 2px solid var(--line); }
  .tabs button { border: 2px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; padding: .35rem 1.2rem;
    background: var(--panel); margin-bottom: -2px; font-weight: bold; }
  .tabs button[aria-selected=true] { background: var(--bg); border-color: var(--line); border-bottom: 2px solid var(--bg); color: var(--gene); }
  /* active filters */
  .filters { display: flex; flex-wrap: wrap; gap: .5rem .7rem; align-items: center; margin: .9rem 0 0;
    padding: .5rem .8rem; border: 2px solid var(--cur); border-radius: 10px; background: var(--panel); }
  .filters b { margin-right: .2rem; }
  .fchip { display: inline-flex; align-items: center; gap: .3rem; border: 1px solid #888; border-radius: 999px;
    background: var(--bg); padding: .05rem .2rem .05rem .75rem; }
  .fchip button { border: none; background: none; padding: 0 .45rem; font-weight: bold; color: var(--fg); }
  .fchip button:hover { color: #b00020; }
  .clearall { font-weight: bold; }
  /* (i): how this search works */
  .info { width: 1.6em; height: 1.6em; padding: 0; border: 1px solid #888; border-radius: 99px; background: var(--bg);
    color: var(--gene); font: italic bold .9rem/1 Georgia, serif; vertical-align: .1em; margin-left: .3rem; }
  .info:hover { background: var(--panel); }
  #how { max-width: min(46rem, calc(100vw - 2rem)); max-height: 82vh; overflow: auto; padding: .9rem 1.3rem 1.1rem;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #how::backdrop { background: rgba(0, 0, 0, .12); }
  #how h2 { margin-top: 0; display: flex; justify-content: space-between; gap: 1rem; }
  #how ul { margin: .4rem 0; padding-left: 1.3rem; }
  #how li { margin: .35rem 0; }
  /* progress */
  .working { margin-top: 1rem; padding: .7rem 1rem; border: 2px solid var(--focus); border-radius: 10px; max-width: 70ch; }
  .working progress { width: 100%; height: 1.1rem; margin: .4rem 0; accent-color: var(--focus); }
  ol.papers { list-style: none; padding: 0; margin: 0; }
  ol.papers > li { border-top: 1px solid var(--line); padding: 1rem 0; }
  .title { font-weight: bold; font-size: 1.15rem; line-height: 1.45; max-width: 70ch; }
  .meta { color: var(--muted); font-size: .95rem; }
  .meta a { color: var(--gene); }
  /* a paper's disease links: Open Targets curated (OT) and Europe PMC text-mined (ePMC); click = that facet */
  .dchip { display: inline-flex; align-items: center; gap: .4rem; border: 2px solid var(--cur); border-radius: 6px;
    background: var(--bg); padding: 0 .45rem 0 0; font-size: .9rem; margin: .25rem .3rem 0 0; overflow: hidden; }
  .dchip .src { border-radius: 0; }
  .dchip.ep { border-color: var(--ep); }
  .dchip:hover { background: var(--panel); }
  .dchip[aria-pressed=true] { font-weight: bold; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .tag { display: inline-block; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
    padding: 0 .4rem; font-size: .9rem; font-weight: normal; margin-left: .4rem; }
  .chip {
    display: inline-block; border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 0 .55rem; font-size: .9rem; margin: .25rem .25rem 0 0; color: var(--fg);
  }
  details.abs > summary { cursor: pointer; color: var(--gene); font-size: .95rem; margin-top: .3rem; }
  details.tags { display: inline; }
  details.tags > summary { display: inline; cursor: pointer; color: var(--muted); font-size: .9rem; margin-left: .2rem; }
  details.tags[open] > summary { display: block; }
  .abstract { white-space: pre-line; max-width: 70ch; margin: .4rem 0 0; }
  mark.g { background: none; color: var(--gene); font-weight: bold; text-decoration: underline 2px solid; text-underline-offset: 3px; }
  mark.t { background: var(--term-bg); color: inherit; text-decoration: underline 2px dashed var(--term-line); text-underline-offset: 3px; }
  nav.pager { display: flex; gap: .6rem; align-items: center; margin-top: 1rem; }
  /* map */
  .seg { display: inline-flex; border: 1px solid #888; border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: .25rem .8rem; }
  .seg button + button { border-left: 1px solid #888; }
  .seg button[aria-pressed=true] { background: var(--gene); color: #fff; }
  .years { display: inline-flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .years input[type=range] { width: 14rem; accent-color: var(--gene); padding: 0; }
  #play { min-width: 8.5rem; }
  #yrNote { font-variant-numeric: tabular-nums; }
  #plot { height: 74vh; min-height: 30rem; border: 1px solid var(--line); border-radius: 10px; margin-top: .6rem; }
  #mappaper ol.papers > li { border-top: 3px solid var(--gene); }
  .crumbs { display: flex; flex-wrap: wrap; gap: .3rem .5rem; align-items: center; margin: .4rem 0; }
  .crumbs button { padding: .1rem .55rem; }
  .axes { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; align-items: end; margin: .8rem 0 .2rem;
    padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .axes .axis { display: flex; gap: .5rem; align-items: end; flex-wrap: wrap; }
  .axes input { width: 19rem; }
  .axes select { max-width: 16rem; }
  .axes label > span { font-weight: bold; color: var(--fg); }
  ol.topics { list-style: none; padding: 0; margin: 0; columns: 2 24rem; column-gap: 1.5rem; }
  ol.topics li { break-inside: avoid; display: flex; gap: .3rem; align-items: start; }
  ol.topics button[data-topic] { flex: 1; text-align: left; border: 1px solid transparent; background: transparent;
    border-radius: 6px; padding: .3rem .5rem; display: flex; gap: .6rem; align-items: baseline; }
  ol.topics button[data-topic]:hover { background: var(--panel); border-color: var(--line); }
  ol.topics button[data-topic].on { border-color: var(--fg); background: var(--panel); }
  ol.topics button.drill { flex: none; margin-top: .3rem; padding: .05rem .5rem; font-size: .9rem; }
  .sw { flex: none; width: .9rem; height: .9rem; border-radius: 3px; display: inline-block; transform: translateY(.1rem); }
  .terms { color: var(--muted); font-size: .9rem; display: block; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <form id="f" autocomplete="off">
      <label>Gene
        <input id="gene" placeholder="symbol, alias or name" aria-label="Gene">
      </label>
      <label>and&hellip; (optional)
        <input id="term" placeholder="disease or any words" aria-label="And words">
      </label>
      <label>Rank by
        <select id="rank" aria-label="Rank by">
          <option value="">Keywords (BM25)</option>
          <option value="meaning">Meaning (AI embeddings)</option>
          <option value="hybrid">Both (hybrid)</option>
        </select>
      </label>
      <button class="primary" type="submit">Search</button>
      <button type="button" id="creamBtn" title="Toggle cream background">Cream</button>
    </form>
    <div class="hint">Press <kbd>/</kbd> to jump to the gene box. Examples:
      <a href="?gene=ZCCHC8&amp;q=pulmonary+fibrosis">ZCCHC8 + pulmonary fibrosis</a>,
      <a href="?gene=CFTR&amp;q=sweat+chloride&amp;rank=hybrid">CFTR + sweat chloride (hybrid)</a>,
      <a href="?gene=p53">p53</a>, <a href="?gene=BRCA">BRCA</a></div>
  </div>
</header>

<div class="wrap">
  <div id="msg"></div>
  <div id="choices" class="choices"></div>
  <section id="card" class="card"></section>
  <div class="cols">
    <aside id="dis" aria-label="Diseases linked to this gene"></aside>
    <section id="list"></section>
  </div>
</div>
<div id="how" popover></div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => (n ?? 0).toLocaleString("en-GB");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? "" : "s"}`;
const ext = (url, html) => `<a href="${esc(url)}" target="_blank" rel="noopener">${html}</a>`;
// Plotly's SVG text knows numeric entities but not &quot;: escape only what it would read as markup.
const pesc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => `&#${c.charCodeAt(0)};`);
function setList(html) {  // replace the results; free the old map's WebGL context first
  if (window.Plotly && $("plot")) Plotly.purge($("plot"));
  $("list").innerHTML = html;
}

// ---- state <-> URL
// gene, q, ot and ep (disease facets: "" = off, "any", or a disease id; ot = Open Targets curated,
// ep = Europe PMC text-mined), ymin, ymax, sort, match ("" = all words, "any"), rank ("" = keywords,
// "meaning", "hybrid"), view ("" = list, "map", "explore"), topic (map drill-in path, e.g. "3.2"),
// ax and ay (Map Explorer axes: words, or "topic:N"), page
let S = {};
let G = null;    // current gene record from /api/gene
let reqNo = 0;   // bumps on every new request; stale answers and polls are dropped
const KEYS = ["gene", "q", "ot", "ep", "ymin", "ymax", "sort", "match", "rank", "view", "topic", "ax", "ay"];
const DN = {};   // disease id -> name (from the gene's facets, paper chips and the server)
const dname = (id) => DN[id] || id;

function readURL() {
  const p = new URLSearchParams(location.search);
  S = Object.fromEntries(KEYS.map((k) => [k, p.get(k) || ""]));
  S.page = +(p.get("page") || 1);
  // Older links: src=curated|epmc + disease (+ dname), cur=1 (curated papers only)
  const d = p.get("disease");
  if (d && p.get("src")) S[p.get("src") === "curated" ? "ot" : "ep"] ||= d;
  if (d && p.get("dname")) DN[d] = p.get("dname");
  if (p.get("cur")) S.ot ||= "any";
}
function writeURL(push = true) {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(S)) if (v && !(k === "page" && v === 1)) p.set(k, v);
  const url = "?" + p.toString();
  if (url !== location.search) (push ? history.pushState : history.replaceState).call(history, null, "", url);
}
const apiParams = (extra = {}) => new URLSearchParams({gene: G.hgnc_id, term: S.q, ot: S.ot, ep: S.ep,
  ymin: S.ymin || 0, ymax: S.ymax || 0, sort: S.sort, match: S.match || "all",
  rank: S.rank || "keywords", page: S.page, ...extra});

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));

// Poll an endpoint that answers {pending: progress} until it has the result; null if superseded.
async function poll(url, my, show) {
  for (;;) {
    const r = await getJSON(url);
    if (my !== reqNo) return null;
    if (!r.pending) return r;
    if (r.pending.error) throw new Error(r.pending.error);
    show(progressHTML(r.pending, r.n));
    await sleep(1000);
    if (my !== reqNo) return null;
  }
}
function progressHTML(p, n) {  // n = how many papers the work is on, when the server says
  const pct = p.total ? Math.floor(100 * p.done / p.total) : null;
  const eta = p.eta_s == null ? "" : p.eta_s < 90 ? ` · about ${p.eta_s} s left` : ` · about ${Math.round(p.eta_s / 60)} min left`;
  return `<div class="working" role="status">
    <b>Working${n ? ` on ${fmt(n)} papers` : ""}: ${esc(p.phase)}…</b>
    ${p.total ? `<progress max="${p.total}" value="${p.done}"></progress>
      <div>${fmt(p.done)} of ${fmt(p.total)} papers (${pct}%)${eta}</div>`
      : `<progress></progress><div class="hint">${fmt(p.elapsed_s)} s so far</div>`}
    ${p.note ? `<p class="hint">${esc(p.note)}</p>` : ""}
  </div>`;
}

// ---- highlighting: gene mentions (blue, solid underline) and search words (yellow, dashed underline)
// Gene symbol and short or all-caps mentions match case-sensitively (WAS must not mark "was",
// IMPACT not "impact"); longer mixed-case mentions ("tumor protein p53") and search words ignore case.
const anyCase = (w) => [...w].map((c) => {
  const l = c.toLowerCase(), u = c.toUpperCase();
  return l === u || l.length > 1 || u.length > 1 ? reEsc(c) : `[${l}${u}]`;
}).join("");
const geneCase = (w) => (w.length > 5 && w !== w.toUpperCase() ? anyCase(w) : reEsc(w));
function highlighter(geneWords, termWords) {
  const alt = (ws, f) => [...new Set(ws.filter((w) => w && w.length > 1))].sort((a, b) => b.length - a.length).map(f).join("|") || "(?!)";
  const re = new RegExp(`(?<![\\p{L}\\p{N}])(?:(${alt(geneWords, geneCase)})|(${alt(termWords, anyCase)}))(?![\\p{L}\\p{N}])`, "gu");
  return (text) => {
    if (!text) return "";
    let out = "", last = 0;
    for (const m of text.matchAll(re)) {
      out += esc(text.slice(last, m.index)) + `<mark class="${m[1] !== undefined ? "g" : "t"}">${esc(m[0])}</mark>`;
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  };
}
// PubTator sometimes tags plain words as the gene ("was" for WAS, "clock" for CLOCK): skip
// lower-case, digit-free spellings of the symbol ("tp53", zebrafish, is kept).
const realMention = (m) => !(m === m.toLowerCase() && !/\d/.test(m) && m.toUpperCase() === G.symbol);
const hl = (p) => highlighter([...p.gene_mentions.filter(realMention), G.symbol], p.term_words);

// ---- gene search
async function searchGene(push = true) {
  const q = S.gene.trim();
  $("choices").innerHTML = ""; $("msg").innerHTML = "";
  if (!q) return;
  const res = await getJSON("/api/resolve?q=" + encodeURIComponent(q));
  if (!res.matches.length) {
    clearGene(); $("msg").innerHTML = `<p>No gene found for <b>${esc(q)}</b>. Try a symbol (e.g. CFTR), an alias or part of the name.</p>`;
    return;
  }
  if (res.matches.length === 1 && !res.partial) return loadGene(res.matches[0], res.also || [], push);
  clearGene();
  $("choices").innerHTML = (res.partial
      ? `<h2>No exact match for “${esc(q)}”. Did you mean:</h2>
         <p class="hint">Only human (HGNC) genes are listed. For a mouse or rat gene, type the human symbol (e.g. TP53 for Trp53).</p>`
      : `<h2>${fmt(res.matches.length)} genes match “${esc(q)}”. Pick one:</h2>`) +
    res.matches.map((g, i) => `<button data-i="${i}"><b>${esc(g.symbol)}</b> &nbsp;${esc(g.name)}
       <span class="muted">· ${esc(g.why)} · ${fmt(g.n_papers)} papers</span></button>`).join("") +
    (res.n_more ? `<p class="muted">…and ${fmt(res.n_more)} more. Type more letters to narrow it down.</p>` : "");
  $("choices").querySelectorAll("button").forEach((b) => b.onclick = () => {
    $("choices").innerHTML = "";
    loadGene(res.matches[+b.dataset.i], [], true, true);
  });
}

function clearGene() { G = null; M = null; $("card").innerHTML = ""; $("dis").innerHTML = ""; setList(""); }

async function loadGene(g, also, push, picked = false) {
  if (picked) { S.gene = g.symbol; $("gene").value = g.symbol; }
  G = await getJSON("/api/gene/" + encodeURIComponent(g.hgnc_id));
  for (const d of [...G.curated, ...G.epmc]) DN[d.disease_id] = d.disease;
  const otherNames = [G.aliases.length ? `Also known as: ${esc(G.aliases.join(", "))}` : "",
                      G.prev.length ? `Previous symbols: ${esc(G.prev.join(", "))}` : ""].filter(Boolean).join(" · ");
  // Location and locus group are HGNC's (NCBI Gene gives the same); each links to its source.
  const kind = !G.locus_group ? "" : G.entrez ? ext(`https://www.ncbi.nlm.nih.gov/gene/${G.entrez}`, `NCBI ${esc(G.locus_group)}`)
                                              : esc(G.locus_group);
  $("card").innerHTML = `
    <h1>${esc(G.symbol)} <span class="nm">${esc(G.name)}</span></h1>
    ${otherNames ? `<p>${otherNames}</p>` : ""}
    <p class="muted">${[esc(G.location || ""), kind,
      ext(`https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/${G.hgnc_id}`, esc(G.hgnc_id))].filter(Boolean).join(" · ")}</p>
    <p><b>${fmt(G.n_tagged)}</b> papers tagged with this gene by PubTator3
       · <b>${fmt(G.n_curated_papers)}</b> curated papers (Open Targets)</p>
    ${also.length ? `<p class="muted">“${esc(S.gene)}” is also an alias or old symbol of:
       ${also.map((a) => `<a href="?gene=${encodeURIComponent(a.symbol)}">${esc(a.symbol)}</a>`).join(", ")}</p>` : ""}`;
  renderDiseases();
  await show(push);
}

// ---- disease facets: one box per source, the same look; a disease in each box = papers in both
const SRC = {ot: ["OT", "Open Targets curated"], ep: ["ePMC", "Europe PMC text-mined"]};
const srcTag = (k) => `<span class="src ${k}" title="${SRC[k][1]}">${SRC[k][0]}</span>`;
const SOURCE_NAMES = {gene2phenotype: "Gene2Phenotype", genomics_england: "Genomics England", orphanet: "Orphanet",
                      uniprot_literature: "UniProt"};
const sources = (list) => list.map((s) => SOURCE_NAMES[s] || s).join(", ");

const EPMC_TOP = 50;  // text-mined diseases listed per box
// fc: counts within the other filters (rows = the diseases with papers there, most first), "wait"
// while they load, or null when no filter is set (the gene's totals and lists).
const BOX = {gene: "", rows: {}, total: {}, open: {}};  // per box: last rows drawn and whether "more" is open
function facetHTML(k, fc) {
  const ot = k === "ot", gene = ot ? G.curated : G.epmc;
  let list = gene, nAll = ot ? G.n_curated_papers : G.n_epmc_papers, total = ot ? gene.length : G.n_epmc_diseases;
  const counting = fc === "wait" && !BOX.rows[k];  // nothing drawn yet for this gene: no rows to keep
  if (fc === "wait") {  // new counts on the way: the rows drawn last, without numbers
    list = (BOX.rows[k] || []).map((d) => ({...d, n_papers: null})); nAll = null; total = BOX.total[k] ?? 0;
  }
  else if (fc) {
    const at = Object.fromEntries(gene.map((d, i) => [d.disease_id, i]));
    const ids = Object.keys(fc[k]).filter((id) => id !== "any")
      .sort((a, b) => fc[k][b] - fc[k][a] || (at[a] ?? 1e9) - (at[b] ?? 1e9) || a.localeCompare(b));
    total = ids.length;
    list = ids.slice(0, ot ? ids.length : EPMC_TOP).map((id) => ({disease_id: id, disease: dname(id), n_papers: fc[k][id],
                                                                   sources: gene[at[id]]?.sources}));
    nAll = fc[k].any;
  }
  if (fc !== "wait") [BOX.rows[k], BOX.total[k]] = [list, total];
  const row = (id, name, n, title) => `<li><button type="button" data-facet="${k}" data-id="${esc(id)}" data-name="${esc(name)}"
      aria-pressed="${S[k] === id}"${n === 0 ? ` class="zero"` : ""}${title ? ` title="${esc(title)}"` : ""}>
      <span${id === "any" ? ` class="any"` : ""}>${esc(name)}</span><span class="n">${n == null ? "" : fmt(n)}</span></button></li>`;
  const rows = (ds) => ds.map((d) => row(d.disease_id, d.disease, d.n_papers, d.sources && `Curated by ${sources(d.sources)}`)).join("");
  const top = list.slice(0, 12), rest = list.slice(12);
  // A disease picked from a paper may be outside the list: show it, picked, under "Any disease".
  const off = S[k] && S[k] !== "any" && !list.some((d) => d.disease_id === S[k])
    ? row(S[k], dname(S[k]), fc && fc !== "wait" ? fc[k][S[k]] ?? 0 : null) : "";
  const shown = total > list.length ? ` (top ${list.length} of ${fmt(total)})` : "";
  const open = BOX.open[k] || rest.some((d) => d.disease_id === S[k]);
  return `<section class="facet ${k}" aria-labelledby="fh-${k}">
    <h2 id="fh-${k}">${srcTag(k)} ${ot ? "Curated diseases" : "Text-mined diseases"}</h2>
    <p class="sub">${ot ? `Open Targets curators: Orphanet, Gene2Phenotype, Genomics England, UniProt.
        ${G.ensembl ? ext(`https://platform.opentargets.org/target/${G.ensembl}`, "Open Targets page") : ""}`
      : "Europe PMC text mining, via Open Targets."}</p>
    ${counting ? `<ul class="dlist">${row("any", "Any disease", null)}${off}</ul><p class="hint">Counting…</p>`
      : list.length || off || nAll || S[k] ? `<ul class="dlist">${row("any", "Any disease", nAll)}${off}${rows(top)}</ul>
      ${rest.length ? `<details class="more" data-box="${k}"${open ? " open" : ""}>
        <summary>${rest.length} more${shown}</summary><ul class="dlist">${rows(rest)}</ul></details>` : ""}`
      : `<p class="muted">None ${fc && gene.length ? "within your other filters" : `for ${esc(G.symbol)}`}.</p>`}
  </section>`;
}

let FC = null;  // box counts within the other filters, for FC.key
const keyWords = () => S.q.trim() && !S.rank ? S.q.trim() : "";  // keyword words filter the list; meaning words only rank it
const facetKey = () => [G?.hgnc_id, S.ot, S.ep, keyWords(), S.match, S.ymin, S.ymax].join("|");
function renderDiseases() {
  if (!G) return;
  const filtered = S.ot || S.ep || S.ymin || S.ymax || keyWords(), key = facetKey();
  if (filtered && FC?.key !== key)
    getJSON("/api/facets?" + new URLSearchParams({gene: G.hgnc_id, ot: S.ot, ep: S.ep, term: keyWords(), match: S.match || "all",
                                                  ymin: S.ymin || 0, ymax: S.ymax || 0})).then((fc) => {
      if (FC?.key === key || facetKey() !== key) return;  // already drawn, or the filters moved on
      const named = Object.keys(fc.names).some((id) => DN[id] !== fc.names[id]);
      Object.assign(DN, fc.names);
      FC = {key, ...fc};
      renderDiseases();
      const bar = document.querySelector("#list .filters");  // a filter chip may still show a bare id
      if (named && bar) { bar.outerHTML = filtersHTML(); wireTop(); }
    }).catch(() => {});
  const fc = !filtered ? null : FC?.key === key ? FC : "wait";
  if (BOX.gene !== G.hgnc_id) Object.assign(BOX, {gene: G.hgnc_id, rows: {}, total: {}, open: {}});
  const f = document.activeElement?.closest?.("#dis [data-facet]");  // keep keyboard focus on the row
  $("dis").innerHTML = facetHTML("ot", fc) + facetHTML("ep", fc) +
    `<p class="hint">Click a disease to show only its papers (clears the “and…” words). Pick one in each box = papers in both.
      ${fc ? "Counts are within your other filters." : ""}</p>`;
  if (f) $("dis").querySelector(`[data-facet="${f.dataset.facet}"][data-id="${CSS.escape(f.dataset.id)}"]`)?.focus();
}
function addNames(names) {  // disease names from the server; redraw the boxes if one was missing or differs
  const fresh = Object.entries(names || {}).filter(([id, name]) => DN[id] !== name);
  for (const [id, name] of fresh) DN[id] = name;
  if (fresh.length) renderDiseases();
}

// A disease from a facet box or a paper's chip; clicking the one already picked turns it off.
function pickDisease(k, id, name) {
  if (name) DN[id] = name;
  const off = S[k] === id;
  S[k] = off ? "" : id;
  // A disease replaces the "and…" words: both together usually leave nothing (the words are
  // often the same disease, spelled differently).
  if (!off && id !== "any") { Object.assign(S, {q: "", match: "", sort: ""}); $("term").value = ""; }
  S.page = 1; S.topic = "";
  renderDiseases(); show(true);
  const top = $("list").getBoundingClientRect().top;
  if (top < 0 || top > innerHeight * 0.6) $("list").scrollIntoView({behavior: "smooth", block: "start"});
}
$("dis").addEventListener("click", (e) => {  // remember each box's "more" list as the user leaves it (open or shut)
  const d = e.target.closest("details.more > summary")?.parentElement;
  if (d) BOX.open[d.dataset.box] = !d.open;  // (the click comes before the toggle)
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-facet]");
  if (b && G) pickDisease(b.dataset.facet, b.dataset.id, b.dataset.name);
});

// ---- shared top of the results: tabs, active filters, how it works
function filtersHTML() {
  const f = [];
  const chip = (label, key) => f.push(`<span class="fchip">${label}<button type="button" data-clear="${key}"
      title="Remove this filter" aria-label="Remove filter: ${esc(label.replace(/<[^>]+>/g, ""))}">✕</button></span>`);
  for (const k of ["ot", "ep"]) if (S[k])
    chip(`${srcTag(k)} <b>${S[k] === "any" ? `any ${k === "ot" ? "curated" : "text-mined"} disease` : esc(dname(S[k]))}</b>`, k);
  if (S.q.trim() && !S.rank) chip(`Words: <b>“${esc(S.q.trim())}”</b>`, "q");  // meaning/hybrid rank, not filter
  if (S.ymin || S.ymax) chip(`Years: <b>${esc(S.ymin || "…")}–${esc(S.ymax || "…")}</b>`, "years");
  if (!f.length) return "";
  return `<div class="filters" role="region" aria-label="Active filters"><b>Showing only:</b> ${f.join("")}
    <button type="button" class="clearall" data-clear="all">${f.length > 1 ? "Clear all filters" : "Clear filter"}</button></div>`;
}
function clearFilter(key) {
  if (key === "ot" || key === "all") S.ot = "";
  if (key === "ep" || key === "all") S.ep = "";
  if (key === "q" || key === "all") { Object.assign(S, {q: "", match: "", sort: ""}); $("term").value = ""; }
  if (key === "years" || key === "all") Object.assign(S, {ymin: "", ymax: ""});
  S.page = 1; S.topic = ""; renderDiseases(); show(true);
}

const infoBtn = () => `<button type="button" class="info" popovertarget="how" title="How this search works"
  aria-label="How this search works">i</button>`;

function howHTML(r) {
  const term = S.q.trim(), sym = esc(G.symbol);
  const ranked = !term ? (S.rank ? `Type words in “and…” to rank them by ${S.rank === "meaning" ? "meaning" : "keywords and meaning"}.` :
                          "Newest first. Type words in “and…” to rank them.")
    : !S.rank ? "Your words rank them by <b>keyword match</b> (BM25). This is <b>not</b> AI or semantic search: choose “Meaning” in <i>Rank by</i> for that."
    : S.rank === "meaning" ? "Ranked by <b>meaning</b>: an AI model compares your words with each title and abstract, so a paper can match without using your exact words."
    : "Ranked by <b>keyword match and meaning together</b> (hybrid).";
  const src = r && r.sem_source === "full" ? "taken from a ready-made index of all PubMed abstracts"
    : "worked out on this computer for this gene’s papers the first time you ask, then saved";
  const linked = (who, k) => `${who} ${k === "ot" ? "linked" : "links"} to ${sym} and ${S[k] === "any" ? "a disease" : esc(dname(S[k]))}`;
  const conds = [S.ot && linked("Open Targets curators", "ot"), S.ep && linked("Europe PMC text mining", "ep")].filter(Boolean);
  const which = conds.length ? `the papers are those ${conds.join(", and that ")}.`
    : `the papers are those PubTator3 (NCBI text mining, done in advance) tagged with ${sym}, plus Open Targets curated papers.`;
  return `<h2>How this search works <button type="button" popovertarget="how" popovertargetaction="hide">Close</button></h2>
    <p>Here ${which} ${ranked}</p>
    <ul>
      <li><b>Which papers.</b> PubTator3 tags genes in all PubMed abstracts and in open-access PubMed Central full texts, ahead of time. Open Targets adds
        curated gene–disease papers (Orphanet, Gene2Phenotype, Genomics England, UniProt). The disease boxes on the left use
        Open Targets’ curated (OT) and Europe PMC text-mined (ePMC) gene–disease links; a disease in each box shows the papers in both.</li>
      <li><b>Keywords (BM25).</b> Worked out live over this gene’s papers. Counts your words (and their forms, such as
        fibrosis and fibroses) in each title and abstract. Rare words count more, long abstracts a bit less. By default
        only papers with all your words are listed. No AI.</li>
      <li><b>Meaning (AI embeddings).</b> The MedEmbed-small model turns each title + abstract, and your words, into
        384 numbers that capture meaning. Papers are ranked by how close they are (cosine similarity), so every
        paper is listed, closest first. The paper numbers are ${src}.</li>
      <li><b>Both (hybrid).</b> Each paper scores 1/(60 + its keyword rank) + 1/(60 + its meaning rank)
        (reciprocal rank fusion), so papers near the top of either list rise.</li>
      <li><b>Map.</b> Places the papers by meaning: UMAP squeezes the 384 numbers to 12 for finding topics (HDBSCAN,
        at most 8) and to 2 for drawing. Papers between topics join the nearest one; the least typical stay grey.
        Topics are named by their most distinctive words, or by an AI when available. “Drill in” makes a new map of one topic’s papers.</li>
      <li><b>Map Explorer.</b> Each axis is how close each paper is in meaning to your words (embedded by the same model),
        or to a topic’s centre (the average of its papers’ 384 numbers): the cosine similarity, which is the paper’s
        384 numbers projected onto that direction.</li>
    </ul>`;
}

function tabsHTML() {
  const t = (v, label) => `<button type="button" role="tab" data-view="${v}" aria-selected="${S.view === v}">${label}</button>`;
  return `<div class="tabs" role="tablist">${t("", "List")}${t("map", "Map")}${t("explore", "Map Explorer")}</div>`;
}

function wireTop() {
  document.querySelectorAll("#list [data-clear]").forEach((b) => b.onclick = () => clearFilter(b.dataset.clear));
  document.querySelectorAll("#list [data-view]").forEach((b) => b.onclick = () => {
    if (S.view !== b.dataset.view) { S.view = b.dataset.view; show(true); }
  });
}

// ---- results: list or map
const isMap = () => S.view === "map" || S.view === "explore";
function show(push = true) { playing = false; return isMap() ? loadMap(push) : loadPapers(push); }

function scopeText(n) {
  const conds = [S.ot && (S.ot === "any" ? "curated (any disease)" : `curated for ${esc(dname(S.ot))}`),
                 S.ep && (S.ep === "any" ? "text-mined (any disease)" : `text-mined for ${esc(dname(S.ep))}`)].filter(Boolean);
  return `paper${n === 1 ? "" : "s"} for ${esc(G.symbol)}${conds.length ? ", " + conds.join(" and ") : ""}`;
}

async function loadPapers(push = true) {
  writeURL(push);
  const my = ++reqNo, t0 = performance.now();
  const head = () => tabsHTML() + filtersHTML();
  const st = document.querySelector("#list .status");
  if (st && document.querySelector("#list ol.papers")) st.innerHTML = `<b>Searching…</b>`;
  else { setList(head() + `<p class="status"><b>Searching…</b></p>`); wireTop(); }
  $("how").innerHTML = howHTML(null);
  let r;
  try {
    r = await poll("/api/papers?" + apiParams(), my, (html) => { setList(head() + html); wireTop(); });
  } catch (e) { setList(head() + `<p class="note">Error: ${esc(e.message)}</p>`); wireTop(); return; }
  if (!r) return;  // a newer request superseded this one
  addNames(r.names);
  const secs = ((performance.now() - t0) / 1000).toFixed(2);
  const term = S.q.trim(), scope = scopeText(r.n_matched), scopeAll = scopeText(r.n_scope);
  const toggle = (to, label) => ` · <button type="button" class="linkish" data-match="${to}">${label}</button>`;
  let what;
  if (!term) what = `<b>${fmt(r.n_matched)}</b> ${scope}`;
  else if (S.rank) {
    what = `<b>${fmt(r.n_matched)}</b> ${scope}, ${S.rank === "meaning" ? `closest in meaning to “${esc(term)}” first`
                                                                       : `best for “${esc(term)}” by keywords and meaning first`}`
      + ` · ${fmt(r.n_all)} ${r.n_all === 1 ? "contains" : "contain"} all the words`;
  }
  else if (!r.n_matched) what = !r.n_scope ? `No ${scopeAll} here` : r.n_scope === 1 ? `The 1 ${scopeAll} does not contain “${esc(term)}”`
    : `None of the ${fmt(r.n_scope)} ${scopeAll} contain “${esc(term)}”`;
  // Several words: count papers with ALL of them (any-word counts are inflated: "19" in "COVID-19").
  else what = r.n_words <= 1 ? `<b>${fmt(r.n_matched)}</b> of ${fmt(r.n_scope)} ${scopeAll} match “${esc(term)}”`
    : r.match === "all" ? `<b>${fmt(r.n_matched)}</b> of ${fmt(r.n_scope)} ${scopeAll} contain all the words “${esc(term)}”` +
        (r.n_any > r.n_all ? toggle("any", `show the ${fmt(r.n_any)} with any word`) : "")
    : r.n_all ? `<b>${fmt(r.n_matched)}</b> of ${fmt(r.n_scope)} ${scopeAll} contain any of the words “${esc(term)}”` +
        toggle("", `show only the ${fmt(r.n_all)} with all words`)
    : `No paper has all the words “${esc(term)}”. Showing the <b>${fmt(r.n_matched)}</b> of ${fmt(r.n_scope)} ${scopeAll} with any of them`;
  const capped = r.sem_capped ? `<p class="note">Meaning ranking covers the ${fmt(r.sem_capped.n)} best keyword matches of
      ${fmt(r.sem_capped.of)} papers; the rest follow, newest first. (A ready-made AI index of all PubMed is being built;
      once it is there, every paper is ranked.)</p>` : "";
  const sortName = {relevance: "best match first", newest: "newest first", oldest: "oldest first"}[r.sort];
  const csv = "/api/papers.csv?" + apiParams();
  $("how").innerHTML = howHTML(r);
  setList(head() + `
    <p class="status">${what} · ${sortName} · ${secs} s ${infoBtn()}</p>
    ${capped}
    <div class="bar">
      <label>From year <input type="number" id="ymin" value="${esc(S.ymin)}" placeholder="${G.year_min ?? ""}"></label>
      <label>To year <input type="number" id="ymax" value="${esc(S.ymax)}" placeholder="${G.year_max ?? ""}"></label>
      <label>Sort <select id="sort">
        ${term ? `<option value="relevance">Best match</option>` : ""}
        <option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
      <a href="${csv}" download>Download CSV (all ${fmt(r.n_matched)}${r.n_matched > 50000 ? `, about ${fmt(Math.round(r.n_matched / 2000))} MB` : ""})</a>
    </div>
    ${r.n_matched ? "" : `<p class="note">No papers here. ${S.ot || S.ep || term || S.ymin || S.ymax ? "Remove a filter above." : ""}</p>`}
    <ol class="papers">${r.papers.map((p) => paperHTML(p, hl(p))).join("")}</ol>
    ${pager(r)}`);
  wireTop();
  $("sort").value = r.sort;
  $("sort").onchange = (e) => { S.sort = e.target.value; S.page = 1; loadPapers(); };
  document.querySelectorAll("#list [data-match]").forEach((b) => b.onclick = () => { S.match = b.dataset.match; S.page = 1; renderDiseases(); loadPapers(); });
  for (const k of ["ymin", "ymax"]) $(k).onchange = (e) => { S[k] = e.target.value; S.page = 1; S.topic = ""; renderDiseases(); loadPapers(); };
  document.querySelectorAll("nav.pager button").forEach((b) => b.onclick = () => {
    S.page = +b.dataset.p; loadPapers().then(() => $("list").scrollIntoView({behavior: "smooth"}));
  });
}

function scoreText(p) {
  if (S.rank === "meaning" && p.sim != null) return `meaning match ${p.sim.toFixed(2)}`;
  if (S.rank === "hybrid" && (p.kw_rank || p.sem_rank))
    return `${p.kw_rank ? `keyword rank ${fmt(p.kw_rank)}` : "no keyword match"} · ${p.sem_rank ? `meaning rank ${fmt(p.sem_rank)}` : "no meaning score"}`;
  return p.bm25 != null ? `keyword score ${p.bm25}` : "";
}

const EP_SHOWN = 6;  // text-mined chips shown per paper before "+N more"
function paperHTML(p, h) {
  const url = `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`;
  const title = p.title ? h(p.title) : `<a href="${url}" target="_blank" rel="noopener">PMID ${p.pmid}</a><span class="tag">no abstract</span>`;
  const abs = p.abstract ? h(p.abstract) : "";
  const named = (title + abs).includes('<mark class="g">');
  const meta = [p.journal && esc(p.journal), p.year, p.title && `<a href="${url}" target="_blank" rel="noopener">PMID ${p.pmid}</a>`,
                S.q.trim() && scoreText(p)].filter(Boolean).join(" · ");
  const link = (k, d, why) => `<button type="button" class="dchip ${k}" data-facet="${k}" data-id="${esc(d.disease_id)}"
      data-name="${esc(d.disease)}" aria-pressed="${S[k] === d.disease_id}" title="${esc(`${why} ${S[k] === d.disease_id
        ? "Click to show all papers again." : `Click to show only these papers for ${G.symbol} + ${d.disease}.`}`)}">${srcTag(k)}${esc(d.disease)}</button>`;
  const first = (ds, k) => [...ds.filter((d) => S[k] === d.disease_id), ...ds.filter((d) => S[k] !== d.disease_id)];  // the picked one
  const ot = first(p.curated, "ot").map((c) => link("ot", c, `Open Targets curated (${sources(c.sources)}).`));
  const ep = first(p.epmc, "ep").map((d) => link("ep", d, "Europe PMC text-mined link."));
  const links = [...ot, ...ep.slice(0, EP_SHOWN)].join("") + (ep.length > EP_SHOWN
    ? `<details class="tags"><summary>+${ep.length - EP_SHOWN} more text-mined</summary>${ep.slice(EP_SHOWN).join("")}</details>` : "");
  const chip = (d) => `<span class="chip" title="PubTator: ${esc(d.id)} ${esc(d.canonical)}">${esc(d.name)}</span>`;
  const inAbs = p.diseases.filter((d) => d.in_abstract), other = p.diseases.filter((d) => !d.in_abstract);
  const chips = inAbs.map(chip).join("") + (other.length
    ? `<details class="tags"><summary>${inAbs.length ? "+" : ""}${other.length} disease tag${other.length === 1 ? "" : "s"} from full text / MeSH</summary>${other.map(chip).join("")}</details>`
    : "");
  return `<li>
    <div class="title">${title}</div>
    ${meta ? `<div class="meta">${meta}</div>` : ""}
    ${links ? `<div>${links}</div>` : ""}
    ${chips ? `<div>${chips}</div>` : ""}
    ${p.title && !named ? `<div class="hint">${esc(G.symbol)} is not named in the title or abstract (tagged in the full text, or linked by curation).</div>` : ""}
    ${abs ? `<details class="abs"><summary>Abstract</summary><p class="abstract">${abs}</p></details>` : ""}
  </li>`;
}

function pager(r) {
  if (r.n_pages <= 1) return "";
  const b = (p, label, dis) => `<button data-p="${p}" ${dis ? "disabled" : ""}>${label}</button>`;
  return `<nav class="pager">${b(1, "« First", r.page === 1)}${b(r.page - 1, "‹ Previous", r.page === 1)}
    <span>Page ${fmt(r.page)} of ${fmt(r.n_pages)}</span>
    ${b(r.page + 1, "Next ›", r.page === r.n_pages)}${b(r.n_pages, "Last »", r.page === r.n_pages)}</nav>`;
}

// ---- literature map (Map and Map Explorer tabs)
// Categorical slots in fixed order (validated: CVD-safe adjacent pairs; light hues need the direct
// labels and the topic list, which are always shown). The server makes at most 8 topics, one slot
// each; papers in no topic are a pale grey, drawn smaller and underneath.
const SLOTS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
const NOISE = "#d6d5cf", INK = "#0b0b0b", FONT = "Atkinson Hyperlegible, Verdana, sans-serif";
const topicColour = (c) => c < 1 ? NOISE : SLOTS[(c - 1) % SLOTS.length];
const DRILL_MIN = 30;  // smallest topic offered a map of its own
// Map Explorer's plot margins: fixed (no growing for the year colour bar), so a glide starts and ends where the dots draw
const exMargin = () => ({l: 74, r: mapColour === "year" ? 96 : 12, t: 12, b: 64, autoexpand: false});
const AXES_HINT = "Each axis: how close each paper is in meaning to your words, or to a topic’s centre. Short words work best, e.g. “mouse model”.";
let M = null;          // the map from /api/map (+ params, secs)
let EX = null;         // Map Explorer positions for M: {id, ax, ay, x, y, r, range}
let MORPH = null;      // in-between positions (in EX's units) while the dots glide onto new axes
let mapColour = "topic", mapFocus = 0, hoverFocus = 0, lastHoverC = 0, shiftHeld = false, mapYear = null, playing = false, zoomK = 1;
let drawn = {rev: "", cur: [], big: 11, annotations: []};  // what drawMap drew last
let axesCall = 0;      // bumps on every axes request; a late answer to an older one is dropped

function loadPlotly() {
  if (window.Plotly) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdn.plot.ly/plotly-2.35.2.min.js"; s.onload = ok; s.onerror = () => fail(new Error("could not load plotly.js"));
    document.head.appendChild(s);
  });
}

async function loadMap(push = true) {
  writeURL(push);
  playing = false;
  const my = ++reqNo, t0 = performance.now();
  const head = () => tabsHTML() + filtersHTML();
  const params = apiParams({topic: S.topic, page: 1, sort: ""}).toString();
  $("how").innerHTML = howHTML(null);

// ---- years: a slider and a Play button; papers appear year by year, still coloured by topic

function syncYear() {

  for (const y of M.year) { if (y > 0 && y <= mapYear) upTo++; if (y === mapYear) now++; }

const ctx2d = document.createElement("canvas").getContext("2d");
const textWidth = (text, size) => { ctx2d.font = `${size}px ${FONT}`; return ctx2d.measureText(text).width; };

// or cover a curated paper, moves up, down or sideways (with a thin line to its centre); if there
// is no room it is left out until you zoom in. Every name is also in the topic list below the map.
// In Map Explorer topics overlap more, so names only move a little: no long crossing lines.

  const covers = (b) => dots.filter(([x, y]) => x > b.x0 - rad && x < b.x1 + rad && y > b.y0 - rad && y < b.y1 + rad).length;

  const shown = (i) => !later(i) && !dim(i) && !r.curated[i];
  // Drawn bottom to top: not yet published (playing years), faded (not the picked topic), no topic,
  // the rest, this year's papers (playing; big, white edge), then curated papers on top.
  add(idx(later), {size: size * 0.7, color: NOISE, opacity: 0.15}, {hoverinfo: "skip"});
  add(idx((i) => !later(i) && dim(i)), {size, color: NOISE, opacity: 0.3});
  const topicMode = mapColour === "topic", rest = idx((i) => shown(i) && !fresh(i) && r.c[i] >= 1);
  const none = idx((i) => shown(i) && !fresh(i) && r.c[i] < 1);
  add(none, {size: topicMode && !focus ? Math.max(3, size * 0.7) : size, opacity: focus ? 0.9 : 0.7, ...colourOf(none),
    ...(topicMode && focus === -1 ? {color: "#8a8984"} : {})});
  add(rest, {size, opacity: yr != null ? 0.45 : focus ? 0.9 : 0.8, ...colourOf(rest),
    ...(topicMode ? {} : {showscale: true, colorbar: {title: {text: "Year"}, thickness: 14}})});
  const now = idx((i) => shown(i) && fresh(i));
  add(now, {size: size * 1.6, opacity: 1, line: {width: 1, color: "#fff"}, ...colourOf(now)});
  // Curated papers: big dots with a ring, drawn last (on top). WebGL hover only measures the distance
  // to a dot's centre, so a small dot beside or under a big curated one would win the hover and the
  // click. So an invisible SVG copy (SVG hover counts the whole dot) takes most hovers, and
  // curatedAt() settles the rest: the mouse inside a curated dot always means that paper.
  const cur = idx((i) => r.curated[i] && !later(i) && !dim(i));
  if (cur.length) {
    traces.push(trace(cur, {name: "curated", marker: {size: big, opacity: 1, line: {width: 2, color: INK}, ...colourOf(cur)}}));
    traces.push(trace(cur, {name: "curated", type: "scatter", marker: {size: big + 2, opacity: 0}}));
  }
  const axis = (k, range) => ({title: {text: pesc(`closer in meaning to ${axisName(EX[k])} →`), font: {size: 16, family: FONT, color: INK}, standoff: 8},
    range: [...range], zeroline: false, gridcolor: "#e6e6e6", tickfont: {size: 14, family: FONT}, automargin: false});
  const layout = {
    showlegend: false, hovermode: "closest", dragmode: "pan", uirevision: rev,
    margin: explore ? exMargin() : {l: 10, r: 10, t: 10, b: 10},
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    xaxis: explore ? axis("ax", EX.range.x) : {visible: false, range: [...(el._wired ? el.layout.xaxis.range : r.range.x)]},
    yaxis: explore ? axis("ay", EX.range.y)
      : {visible: false, range: [...(el._wired ? el.layout.yaxis.range : r.range.y)], scaleanchor: "x"},
    annotations: rev === drawn.rev ? drawn.annotations : [],
    hoverlabel: {font: {size: 16, family: FONT, color: INK}, bgcolor: "#fff", bordercolor: "#888"},
  };
  drawn = {rev, cur, big, annotations: layout.annotations};
  return Plotly.react(el, traces, layout, {responsive: true, displaylogo: false, scrollZoom: true, doubleClick: "reset",
                                           modeBarButtonsToRemove: ["select2d", "lasso2d", "autoScale2d"]})
    .then(() => { wirePlot(el); placeLabels(); });
}

function curatedAt(e) {  // the curated paper (index) under the mouse, the top one if they overlap; else -1
  const el = $("plot"), cur = drawn.cur, P = pos();
  if (!cur.length || !e || e.clientX == null) return -1;
  const xa = el._fullLayout.xaxis, ya = el._fullLayout.yaxis, bb = el.querySelector(".main-svg").getBoundingClientRect();
  const px = e.clientX - bb.left - xa._offset, py = e.clientY - bb.top - ya._offset;
  for (let j = cur.length - 1; j >= 0; j--)
    if (Math.hypot(xa.l2p(P.x[cur[j]]) - px, ya.l2p(P.y[cur[j]]) - py) <= drawn.big / 2 + 1) return cur[j];
  return -1;
}

function wirePlot(el) {  // once per plot element; the handlers read the current map and drawing
  if (el._wired) return;
  el._wired = true;
  if (!el._blurs) {  // (a DOM listener: it outlives Plotly.purge, so add it once)
    el._blurs = true;
    el.addEventListener("pointerdown", () => { if (typing()) document.activeElement.blur(); }, true);
  }
  let resizing = 0;
  el.on("plotly_relayout", (e) => {  // zoom/pan: re-place the names; zoom: resize the dots
    if ("annotations" in e || MORPH) return;
    const k = zoomNow();
    placeLabels();
    if (Math.abs(k - zoomK) > 0.05) { zoomK = k; clearTimeout(resizing); resizing = setTimeout(drawMap, 120); }
  });
  el.on("plotly_hover", (ev) => {
    const q = ev.points[0], i = curatedAt(ev.event), hit = el.data.length - 1;
    lastHoverC = M.c[i >= 0 ? i : q.customdata[5]];
    // shiftHeld, not ev.event.shiftKey: a redraw replays the last mouse event, Shift and all
    const want = shiftHeld && !typing() ? lastHoverC : 0;
    if (want !== hoverFocus) { hoverFocus = want; setTimeout(drawMap); return; }
    const j = drawn.cur.indexOf(i);
    if (i >= 0 && !(q.data.name === "curated" && q.pointNumber === j)) Plotly.Fx.hover(el, [{curveNumber: hit, pointNumber: j}]);
  });
  el.on("plotly_unhover", () => { lastHoverC = 0; });
  el.on("plotly_click", async (ev) => {
    const j = curatedAt(ev.event), pmid = j >= 0 ? M.pmid[j] : ev.points[0].customdata[4];
    const p = await getJSON(`/api/paper?gene=${encodeURIComponent(G.hgnc_id)}&pmid=${pmid}&term=${encodeURIComponent(S.q)}`);
    $("mappaper").innerHTML = `<ol class="papers">${paperHTML(p, hl(p))}</ol>`;
    $("mappaper").querySelector("details.abs")?.setAttribute("open", "");
    $("mappaper").scrollIntoView({behavior: "smooth", block: "nearest"});
  });
}

// ---- wiring
// Scrolling to the results must not hide their top under the sticky header.
new ResizeObserver(([e]) => document.documentElement.style.scrollPaddingTop = `${e.target.offsetHeight + 8}px`)
  .observe(document.querySelector("header"));
$("f").onsubmit = (e) => {
  e.preventDefault();
  document.activeElement?.blur();
  const gene = $("gene").value.trim(), q = $("term").value.trim();
  const sameGene = G && gene.toUpperCase() === S.gene.toUpperCase();
  S = {...S, gene, q, rank: $("rank").value, page: 1, sort: "", match: "", topic: ""};
  if (sameGene) { renderDiseases(); show(); }
  else { Object.assign(S, {ot: "", ep: "", ymin: "", ymax: ""}); searchGene(); }
};
$("rank").onchange = () => {  // keyword ranking lists only papers with the words; the others list all
  S.rank = $("rank").value; S.page = 1; S.sort = ""; S.topic = "";
  if (G) { renderDiseases(); show(); }
};
const typing = () => !!document.activeElement?.matches("textarea, input:not([type=range])");
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !typing()) {
    e.preventDefault(); $("gene").focus(); $("gene").select();
  }
  if (!isMap() || !M) return;
  if (e.key === "Escape" && !document.querySelector("#how:popover-open")) {  // Esc: drop the picked topic, else stop playing
    if (mapFocus || hoverFocus) { hoverFocus = 0; setFocus(0); }
    else if (playing) { playing = false; syncYear(); }
  }
  if (e.key === "Shift" && !typing() && lastHoverC && lastHoverC !== hoverFocus) { hoverFocus = lastHoverC; drawMap(); }  // Shift: pick out the hovered topic
});
document.addEventListener("keydown", (e) => { if (e.key === "Shift") shiftHeld = true; }, true);
const shiftUp = () => {
  shiftHeld = false;
  if (hoverFocus && M) { hoverFocus = 0; drawMap(); }
};
document.addEventListener("keyup", (e) => { if (e.key === "Shift") shiftUp(); });
window.addEventListener("blur", shiftUp);
$("creamBtn").onclick = () => {
  document.body.classList.toggle("cream");
  localStorage.setItem("cream", document.body.classList.contains("cream") ? "1" : "");
};
if (localStorage.getItem("cream")) document.body.classList.add("cream");

async function fromURL() {
  readURL();
  $("gene").value = S.gene; $("term").value = S.q; $("rank").value = S.rank;
  if (S.gene) await searchGene(false); else { clearGene(); $("gene").focus(); }
}
window.addEventListener("popstate", fromURL);
fromURL();
</script>
</body>
</html>
