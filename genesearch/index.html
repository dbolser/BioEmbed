<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gene search</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #555; --line: #d8d8d8; --panel: #f4f5f7;
    --gene: #005a8c; --gene-bg: #d3e6f5; --term-bg: #ffe39a; --term-line: #9a4a00; --cur: #00664a; --ep: #5b3a96; --focus: #0072b2;
  }
  body.cream { --bg: #fbf5e6; --panel: #f1e9d4; --line: #d9cfb6; }
  * { box-sizing: border-box; }
  html { font-size: 19px; }  /* rem = 19px; nothing on the page is smaller than .9rem (17px) */
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 1rem/1.65 "Atkinson Hyperlegible", Verdana, "DejaVu Sans", system-ui, sans-serif;
  }
  .wrap { max-width: 88rem; margin: 0 auto; padding: 0 1.2rem 4rem; }
  #list, #list *, #dis * { scroll-margin-top: var(--head, 0px); }  /* (see --head in the script) */
  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header .wrap { padding-top: .8rem; padding-bottom: .8rem; }
  form { display: flex; flex-wrap: wrap; gap: .6rem; align-items: end; }
  label, .field { display: flex; flex-direction: column; font-size: .9rem; color: var(--muted); }
  input, select, button {
    font: inherit; font-size: 1rem; padding: .35rem .6rem; border: 1px solid #888; border-radius: 6px;
    background: #fff; color: var(--fg);
  }
  #subject { width: 14rem; } #term { width: 17rem; }
  /* the first box's label flips the search between gene and disease */
  .mode { border: none; background: none; padding: 0; font-size: .9rem; color: var(--gene); text-align: left;
    text-decoration: underline dotted; text-underline-offset: 3px; }
  .mode:hover { text-decoration-style: solid; }
  .about { margin-left: auto; align-self: center; font-weight: bold; }
  button { cursor: pointer; background: #fff; }
  button.primary { background: var(--focus); color: #fff; border-color: var(--focus); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .hint { font-size: .9rem; color: var(--muted); }
  .linkish { border: none; background: none; padding: 0; color: var(--gene); text-decoration: underline; font-size: inherit; }
  .muted { color: var(--muted); }
  h1 { font-size: 1.7rem; margin: 1.2rem 0 .2rem; line-height: 1.3; }
  h1 .nm { font-weight: normal; }
  h2 { font-size: 1.2rem; margin: 1.6rem 0 .4rem; }
  a { color: var(--gene); }
  .card p { margin: .25rem 0; }
  .choices button { display: block; width: 100%; text-align: left; margin: .35rem 0; padding: .5rem .8rem; }
  /* disease facets on the left, results on the right */
  .cols { display: grid; grid-template-columns: minmax(14rem, 19rem) minmax(0, 1fr); gap: 1.6rem; align-items: start; }
  @media (max-width: 56rem) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .facet { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: .6rem .7rem .7rem; margin-top: 1.4rem; }
  .facet h2 { font-size: 1.1rem; margin: 0; display: flex; gap: .5rem; align-items: center; }
  .facet .sub { font-size: .9rem; color: var(--muted); margin: .1rem 0 .5rem; line-height: 1.45; }
  .src { display: inline-block; border-radius: 5px; padding: 0 .4rem; font-size: .9rem; font-weight: bold; color: #fff; line-height: 1.5; }
  .src.ot { background: var(--cur); } .src.ep { background: var(--ep); }
  .dlist { list-style: none; padding: 0; margin: 0; }
  .dlist button {
    width: 100%; text-align: left; border: 1px solid transparent; background: transparent; font-size: .95rem; line-height: 1.4;
    padding: .25rem .45rem; border-radius: 6px; display: flex; gap: .8rem; justify-content: space-between;
  }
  .dlist button:hover { border-color: var(--line); background: var(--bg); }
  .facet.ot .dlist button[aria-pressed=true] { border: 2px solid var(--cur); background: var(--bg); font-weight: bold; }
  .facet.ep .dlist button[aria-pressed=true] { border: 2px solid var(--ep); background: var(--bg); font-weight: bold; }
  .facet.nm .dlist button[aria-pressed=true] { border: 2px solid var(--gene); background: var(--bg); font-weight: bold; }
  .dlist .any { font-style: italic; }
  .dlist button.zero { color: var(--muted); }
  .dlist .n { white-space: nowrap; color: var(--muted); font-size: .9rem; min-width: 3em; text-align: right; }
  .stale .n { opacity: .35; }  /* counts from before the last click, while new ones load: rows don't move */
  /* the papers or map from before the last change, faded while the new ones load (in their place: nothing moves) */
  #list > .stale { opacity: .45; }
  details.more > summary { cursor: pointer; color: var(--gene); margin-top: .4rem; font-size: .95rem; }
  .bar { display: flex; flex-wrap: wrap; gap: .8rem 1.2rem; align-items: center; margin: .6rem 0; }
  .bar input[type=number] { width: 5.5rem; }
  .status { font-size: 1.05rem; margin-top: 1rem; }
  .note { background: var(--panel); border-left: 4px solid var(--term-line); padding: .4rem .8rem; max-width: 70ch; }
  /* tabs: List / Map / Map Explorer */
  .tabs { display: flex; gap: .4rem; margin-top: 1.4rem; border-bottom: 2px solid var(--line); }
  .tabs button { border: 2px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; padding: .35rem 1.2rem;
    background: var(--panel); margin-bottom: -2px; font-weight: bold; }
  .tabs button[aria-selected=true] { background: var(--bg); border-color: var(--line); border-bottom: 2px solid var(--bg); color: var(--gene); }
  /* work-in-progress tabs: still clickable, but look provisional (a grey still over 4.5:1 contrast, cream too) */
  .tabs button.wip { color: #6e6e6e; font-weight: normal; border-style: dashed; background: transparent; }
  .tabs button.wip[aria-selected=true] { color: var(--muted); background: var(--bg); }
  /* active filters */
  .filters { display: flex; flex-wrap: wrap; gap: .5rem .7rem; align-items: center; margin: .9rem 0 0;
    padding: .5rem .8rem; border: 2px solid var(--cur); border-radius: 10px; background: var(--panel); }
  .filters b { margin-right: .2rem; }
  /* the bar stays when no filter is set, so picking or clearing one doesn't move what is below it */
  .filters.none { border-color: var(--line); color: var(--muted); }
  .filters.none .clearall { visibility: hidden; }  /* (there, for the bar's height) */
  .fchip { display: inline-flex; align-items: center; gap: .3rem; border: 1px solid #888; border-radius: 999px;
    background: var(--bg); padding: .05rem .2rem .05rem .75rem; }
  .fchip button { border: none; background: none; padding: 0 .45rem; font-weight: bold; color: var(--fg); }
  .fchip button:hover { color: #b00020; }
  .clearall { font-weight: bold; }
  /* (i): how this search works */
  .info { width: 1.6em; height: 1.6em; padding: 0; border: 1px solid #888; border-radius: 99px; background: var(--bg);
    color: var(--gene); font: italic bold .9rem/1 Georgia, serif; vertical-align: .1em; margin-left: .3rem; }
  .info:hover { background: var(--panel); }
  #how { max-width: min(46rem, calc(100vw - 2rem)); max-height: 82vh; overflow: auto; padding: .9rem 1.3rem 1.1rem;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #how::backdrop { background: rgba(0, 0, 0, .12); }
  #how h2 { margin-top: 0; display: flex; justify-content: space-between; gap: 1rem; }
  #how ul { margin: .4rem 0; padding-left: 1.3rem; }
  #how li { margin: .35rem 0; }
  /* progress */
  .working { margin-top: 1rem; padding: .7rem 1rem; border: 2px solid var(--focus); border-radius: 10px; max-width: 70ch; }
  .working progress { width: 100%; height: 1.1rem; margin: .4rem 0; accent-color: var(--focus); }
  .oneline { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ol.papers { list-style: none; padding: 0; margin: 0; }
  ol.papers > li { border-top: 1px solid var(--line); padding: 1rem 0; }
  .title { font-weight: bold; font-size: 1.15rem; line-height: 1.45; max-width: 70ch; }
  .meta { color: var(--muted); font-size: .95rem; }
  .meta a { color: var(--gene); }
  /* a paper's disease links: Open Targets curated (OT) and Europe PMC text-mined (ePMC); click = that facet */
  .dchip { display: inline-flex; align-items: center; gap: .4rem; border: 2px solid var(--cur); border-radius: 6px;
    background: var(--bg); padding: 0 .45rem 0 0; font-size: .9rem; margin: .25rem .3rem 0 0; overflow: hidden; }
  .dchip .src { border-radius: 0; }
  .dchip.ep { border-color: var(--ep); }
  .dchip:hover { background: var(--panel); }
  .dchip[aria-pressed=true] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }  /* (not bold: it would grow) */
  .tag { display: inline-block; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
    padding: 0 .4rem; font-size: .9rem; font-weight: normal; margin-left: .4rem; }
  .chip {
    display: inline-block; border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 0 .55rem; font-size: .9rem; margin: .25rem .25rem 0 0; color: var(--fg);
  }
  details.abs > summary { cursor: pointer; color: var(--gene); font-size: .95rem; margin-top: .3rem; }
  details.tags { display: inline; }
  details.tags > summary { display: inline; cursor: pointer; color: var(--muted); font-size: .9rem; margin-left: .2rem; }
  details.tags[open] > summary { display: block; }
  .abstract { white-space: pre-line; max-width: 70ch; margin: .4rem 0 0; }
  mark.g { background: var(--gene-bg); color: inherit; font-weight: bold; border-radius: 3px; padding: 0 .1em; }
  mark.t { background: var(--term-bg); color: inherit; text-decoration: underline 2px dashed var(--term-line); text-underline-offset: 3px; }
  nav.pager { display: flex; gap: .6rem; align-items: center; margin-top: 1rem; }
  /* map */
  .seg { display: inline-flex; border: 1px solid #888; border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: .25rem .8rem; }
  .seg button + button { border-left: 1px solid #888; }
  .seg button[aria-pressed=true] { background: var(--gene); color: #fff; }
  .years { display: inline-flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .years input[type=range] { width: 14rem; accent-color: var(--gene); padding: 0; }
  #play { min-width: 8.5rem; }
  /* room for the longest note (set per map): a longer one would wrap the bar (and move the slider out from under the
     mouse) */
  #yrNote { font-variant-numeric: tabular-nums; display: inline-block; white-space: nowrap; }  /* (min-width: per map) */
  /* the map's notes that change as you hover and pick: room kept for them, so nothing below moves */
  #maskNote { display: inline-block; }  /* (its min-width: the longest count, set per map) */
  #hiddenNote { min-height: 1.65em; }
  #axesNote { min-height: 8.25em; }  /* five lines: the longest notes */
  @media (max-width: 80rem) { #axesNote { min-height: 9.9em; } }  /* (six, and seven where the column is narrowest) */
  @media (max-width: 68rem) and (min-width: 56rem) { #axesNote { min-height: 11.55em; } }
  @media (max-width: 62rem) and (min-width: 56rem) { #axesNote { min-height: 14.85em; } }
  #plot { height: 74vh; min-height: 30rem; border: 1px solid var(--line); border-radius: 10px; margin-top: .6rem; }
  #mappaper ol.papers > li { border-top: 3px solid var(--gene); }
  .crumbs { display: flex; flex-wrap: wrap; gap: .3rem .5rem; align-items: center; margin: .4rem 0; }
  .crumbs button { padding: .1rem .55rem; }
  .axes { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; align-items: end; margin: .8rem 0 .2rem;
    padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .axes .axis { display: flex; gap: .5rem; align-items: end; flex-wrap: wrap; }
  .axes input { width: 19rem; }
  .axes select { max-width: 16rem; }
  .axes label > span { font-weight: bold; color: var(--fg); }
  ol.topics { list-style: none; padding: 0; margin: 0; columns: 2 24rem; column-gap: 1.5rem; }
  ol.topics li { break-inside: avoid; display: flex; gap: .3rem; align-items: start; }
  ol.topics button[data-topic] { flex: 1; text-align: left; border: 1px solid transparent; background: transparent;
    border-radius: 6px; padding: .3rem .5rem; display: flex; gap: .6rem; align-items: baseline; }
  ol.topics button[data-topic]:hover { background: var(--panel); border-color: var(--line); }
  ol.topics button[data-topic].on { border-color: var(--fg); background: var(--panel); }
  ol.topics button.drill { flex: none; margin-top: .3rem; padding: .05rem .5rem; font-size: .9rem; }
  .sw { flex: none; width: .9rem; height: .9rem; border-radius: 3px; display: inline-block; transform: translateY(.1rem); }
  .terms { color: var(--muted); font-size: .9rem; display: block; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <form id="f" autocomplete="off">
      <div class="field">  <!-- (not a label: a click on it would press the button) -->
        <button type="button" id="mode" class="mode"></button>
        <input id="subject">
      </div>
      <label>Optionally rank by
        <input id="term" aria-label="Optionally rank by these words">
      </label>
      <label>Rank method
        <select id="rank" aria-label="Rank method">
          <option value="keyword">Keyword (BM25)</option>
          <option value="">Semantic (AI embeddings)</option>
          <option value="hybrid">Hybrid (reciprocal rank fusion)</option>
        </select>
      </label>
      <button class="primary" type="submit">Search</button>
      <button type="button" id="creamBtn" title="Toggle cream background">Cream</button>
      <a class="about" href="/about">About</a>
    </form>
    <div class="hint">Press <kbd>/</kbd> to jump to the search box. Examples: <span id="examples"></span></div>
  </div>
</header>

<div class="wrap">
  <div id="msg"></div>
  <div id="choices" class="choices"></div>
  <section id="card" class="card"></section>
  <div class="cols">
    <aside id="dis" aria-label="Filters"></aside>
    <section id="list"></section>
  </div>
</div>
<div id="how" popover></div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => (n ?? 0).toLocaleString("en-GB");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? "" : "s"}`;
const ext = (url, html) => `<a href="${esc(url)}" target="_blank" rel="noopener">${html}</a>`;
// Plotly's SVG text knows numeric entities but not &quot;: escape only what it would read as markup.
const pesc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => `&#${c.charCodeAt(0)};`);
function setList(html) {  // replace the results; free the old map's WebGL context first
  if (window.Plotly && $("plot")) Plotly.purge($("plot"));
  keepFloor();
  $("list").innerHTML = html;
  dropBlankFloor();
}
// Before a redraw: the page doesn't get shorter than the bottom of the window, so a shorter list (or fewer rows on
// the left) can't clamp the scroll and pull the page down under the mouse. The floor goes once the page's own height
// reaches the window's bottom again (the user scrolled up, or the page grew).
function keepFloor() { document.body.style.minHeight = `${Math.max(scrollY + innerHeight, parseFloat(document.body.style.minHeight) || 0)}px`; }
// After a redraw: no floor if it would leave most of the window blank (a much shorter page: a few results, a message).
// Then the scroll is clamped, as before, and the page's end is in view.
function dropBlankFloor() {
  if (document.querySelector("body > .wrap").getBoundingClientRect().bottom < innerHeight / 3) document.body.style.minHeight = "";
}
addEventListener("scroll", () => {
  const wrap = document.querySelector("body > .wrap");
  if (document.body.style.minHeight && wrap.getBoundingClientRect().bottom >= innerHeight) document.body.style.minHeight = "";
}, {passive: true});

// ---- state <-> URL
// gene or disease (what the first box searched for; one of them, see MODE), q, ot and ep (facets:
// "" = off, "any", or an id: diseases for a gene, Ensembl genes for a disease; ot = Open Targets
// curated, ep = Europe PMC text-mined), named ("1" = only papers naming the gene or disease in the
// title or abstract), ymin, ymax, sort, match ("" = all words, "any"), rank ("" = semantic, "keyword",
// "hybrid"), view ("" = list, "map", "explore", "landscape": the PubMedBERT map,
// "medmap": our MedEmbed map), topic (map drill-in path, e.g. "3.2"), ax and ay
// (Map Explorer axes: words, or "topic:N"), page
let S = {};
let G = null;    // the current gene or disease, from /api/subject: id, kind ("gene", "disease"), label, ...
let MODE = "gene";  // what the first box searches for
let reqNo = 0;   // bumps on every new request; stale answers and polls are dropped
const KEYS = ["gene", "disease", "q", "ot", "ep", "named", "ymin", "ymax", "sort", "match", "rank", "view", "topic", "ax", "ay", "pmid"];
const DN = {};   // facet id -> name (from the facets, paper chips and the server)
const dname = (id) => DN[id] || id;
const rank = () => S.rank || "semantic";
const other = () => G?.kind === "disease" ? "gene" : "disease";  // what the facets list

function readURL() {
  const p = new URLSearchParams(location.search);
  S = Object.fromEntries(KEYS.map((k) => [k, p.get(k) || ""]));
  S.page = +(p.get("page") || 1);
  S.pmid = S.pmid.replace(/\D/g, "");  // (the paper open under a map; "PMID_123" works too)
  // Older links: rank=meaning (now semantic, the default; so are old links with words and no rank,
  // which meant keywords then); src=curated|epmc + disease (+ dname) for a gene's disease facet,
  // cur=1 (curated papers only)
  if (!["keyword", "hybrid"].includes(S.rank)) S.rank = "";
  const d = p.get("disease");
  if (d && p.get("src")) { S[p.get("src") === "curated" ? "ot" : "ep"] ||= d; S.disease = ""; }
  if (d && p.get("dname")) DN[d] = p.get("dname");
  if (p.get("cur")) S.ot ||= "any";
  MODE = S.disease ? "disease" : S.gene ? "gene" : history.state?.mode || "gene";
}
function writeURL(push = true) {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(S)) if (v && !(k === "page" && v === 1)) p.set(k, v);
  const url = "?" + p.toString();
  // The mode goes in the history state: an empty search's URL ("?") doesn't say gene or disease
  if (push && url !== location.search) {
    clearTimeout(placeTimer); savePlace();
    history.pushState({mode: MODE, id: entryId(), y: scrollY}, "", url);  // (the new view starts where the page is)
  }
  else history.replaceState({...history.state, mode: MODE}, "", url);
}
// Back, Forward and reload come back to the same place on the page. The browser's own restoring comes before the page
// is drawn again, against a shorter page (it landed far too high), so the place is kept in the history entry (y) and
// restored once the page is drawn (fromURL).
// PLACES has each entry's place at once (a Back right after a scroll has it); y in the entry, for a reload, is saved
// 300 ms after scrolling stops (browsers limit how often an entry can be rewritten).
history.scrollRestoration = "manual";
const entryId = () => Math.random().toString(36).slice(2), PLACES = {};
const freshLink = !history.state?.id;  // (a reload, or Back into the page from elsewhere, has our entry)
if (freshLink) history.replaceState({...history.state, id: entryId(), y: 0}, "");
let placeTimer = 0, restoreY = null;  // restoreY: the place to go back to, once the page is drawn (null: none)
const savePlace = () => history.replaceState({...history.state, y: scrollY}, "");
addEventListener("scroll", () => {
  if (restoreY != null) return;  // (Back or Forward's page still being drawn: where it scrolls meanwhile isn't the place)
  if (history.state?.id) PLACES[history.state.id] = scrollY;  // (an entry not ours, e.g. a #hash typed in: no place)
  clearTimeout(placeTimer); placeTimer = setTimeout(savePlace, 300);
}, {passive: true});
const placeBack = () => { if (restoreY != null) scrollTo(0, restoreY); };  // (as soon as a view's page is in, and at the end)
// The user scrolling or clicking meanwhile wins over a restore still to come, or a jump to new results' top (inputs:
// how many such, so far)
let inputs = 0;
for (const t of ["wheel", "touchmove", "keydown", "pointerdown"]) addEventListener(t, () => { restoreY = null; inputs++; }, {passive: true, capture: true});
const apiParams = (extra = {}) => new URLSearchParams({subject: G.id, term: S.q, ot: S.ot, ep: S.ep,
  named: S.named ? 1 : 0, ymin: S.ymin || 0, ymax: S.ymax || 0, sort: S.sort, match: S.match || "all",
  rank: rank(), page: S.page, ...extra});
// The map is of the list without its facets, which grey out papers on it instead
const mapParams = () => apiParams({topic: S.topic, page: 1, sort: "", ot: "", ep: "", named: 0}).toString();

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));

// Poll an endpoint that answers {pending: progress} until it has the result; null if superseded.
// show(progress, n) draws the progress (progressHTML or progressLine).
async function poll(url, my, show) {
  for (;;) {
    const r = await getJSON(url);
    if (my !== reqNo) return null;
    if (!r.pending) return r;
    if (r.pending.error) throw new Error(r.pending.error);
    show(r.pending, r.n);
    await sleep(1000);
    if (my !== reqNo) return null;
  }
}
function progressHTML(p, n) {  // n = how many papers the work is on, when the server says
  const pct = p.total ? Math.floor(100 * p.done / p.total) : null;
  const eta = p.eta_s == null ? "" : p.eta_s < 90 ? ` · about ${p.eta_s} s left` : ` · about ${Math.round(p.eta_s / 60)} min left`;
  return `<div class="working" role="status">
    <b>Working${n ? ` on ${fmt(n)} papers` : ""}: ${esc(p.phase)}…</b>
    ${p.total ? `<progress max="${p.total}" value="${p.done}"></progress>
      <div>${fmt(p.done)} of ${fmt(p.total)} papers (${pct}%)${eta}</div>`
      : `<progress></progress><div class="hint">${fmt(p.elapsed_s)} s so far</div>`}
    ${p.note ? `<p class="hint">${esc(p.note)}</p>` : ""}
  </div>`;
}
function progressLine(p, n) {  // the same in a line, for a place that keeps its height (a faded map's status, a note)
  const eta = p.eta_s == null ? "" : p.eta_s < 90 ? ` · about ${p.eta_s} s left` : ` · about ${Math.round(p.eta_s / 60)} min left`;
  return `<span class="oneline" role="status"><b>Working${n ? ` on ${fmt(n)} papers` : ""}: ${esc(p.phase)}…</b>${p.total ? ` ${Math.floor(100 * p.done / p.total)}%` : ""}${eta}</span>`;

// A new map (or placement) is on its way while one is drawn: the old one stays, faded, and the status line above it
// (keeping its height) says what is happening. Else the page would shrink to that line and spring back, and the
// scroll with it. false: no map drawn.
function fadeMap(text) {
  const st = document.querySelector("#list .status");

  for (let e = st.nextElementSibling; e; e = e.nextElementSibling) Object.assign(e, {inert: true}).classList.add("stale");
  document.querySelectorAll("#list [data-view]").forEach((b) => b.setAttribute("aria-selected", S.view === b.dataset.view));

// Bring the map into view after a click under it (a topic in the list), unless a third of it is in view already:
// then the list stays under the mouse for the next click.
function showPlot() {
  const r = $("plot").getBoundingClientRect(), top = Math.max(r.top, document.querySelector("header").getBoundingClientRect().bottom);
  if (Math.min(r.bottom, innerHeight) - top < r.height / 3) $("plot").scrollIntoView({behavior: "smooth", block: "nearest"});

// ---- highlighting: gene mentions (bold, pale blue) and search words (yellow, dashed underline)
// Gene symbol and short or all-caps mentions match case-sensitively (WAS must not mark "was",
// IMPACT not "impact"); longer mixed-case mentions ("tumor protein p53") and search words ignore case.
const anyCase = (w) => [...w].map((c) => {
  const l = c.toLowerCase(), u = c.toUpperCase();
  return l === u || l.length > 1 || u.length > 1 ? reEsc(c) : `[${l}${u}]`;
}).join("");
// PubTator3 writes Greek letters as names ("TGF-beta1" for TGF-β1, "TNFalpha") and Unicode dashes and spaces as
// plain ones, HGNC writes "aquaporin 4" where papers write "aquaporin-4", and a few names keep the letter or a
// Unicode dash ("β-actin"): each Greek letter or its name matches either, and any run of dashes and spaces any other
// (as app.py's loose()). f: the case rule for the rest.
const GREEK = {alpha: "αΑ", beta: "βϐΒ", gamma: "γΓ", delta: "δΔ", epsilon: "εϵΕ", zeta: "ζΖ", eta: "ηΗ", theta: "θϑΘ",
               iota: "ιΙ", kappa: "κϰΚ", lambda: "λΛ", mu: "μµΜ", nu: "νΝ", xi: "ξΞ", omicron: "οΟ", pi: "πϖΠ", rho: "ρϱΡ",
               sigma: "σςΣ", tau: "τΤ", upsilon: "υΥ", phi: "φϕΦ", chi: "χΧ", psi: "ψΨ", omega: "ωΩ"};
const GREEK_NAME = Object.fromEntries(Object.entries(GREEK).flatMap(([n, cs]) => [...cs].map((c) => [c, n])));  // "β": "beta"
const DASHES = "-\u2010-\u2015\u2212";  // (a character-class range)
// The Greek names in a form (as is, upper case or capitalized: not "ETa" in "FETalpha"), longest first, each not where
// its tail starts a longer name: "Psi" not in "RPTPsigma" (as app.py's greek_names).
const NAMES = Object.keys(GREEK).sort((a, b) => b.length - a.length);
const greekNames = (form) => NAMES.map((x) => form(x) + [...x.slice(1)].map((_, k) => k + 1).flatMap((k) => NAMES
  .filter((y) => y.startsWith(x.slice(k)) && y.length > x.length - k).map((y) => `(?!${form(y).slice(x.length - k)})`)).join("")).join("|");
const LOOSE = new RegExp(`(${greekNames((n) => n)}|${greekNames((n) => n.toUpperCase())}|${greekNames((n) => n[0].toUpperCase() + n.slice(1))}|` +
                         `[${Object.keys(GREEK_NAME).join("")}])|[${DASHES}\\s]+`, "g");
function loose(w, f) {
  let out = "", last = 0;
  for (const m of w.matchAll(LOOSE)) {
    const name = GREEK_NAME[m[1]] ?? m[1];
    out += f(w.slice(last, m.index)) + (m[1] ? `(?:${f(name)}|[${GREEK[name.toLowerCase()]}])` : `[${DASHES}\\s]+`);
    last = m.index + m[0].length;
  }
  return out + f(w.slice(last));
}
const geneCase = (w) => loose(w, w.length > 5 && w !== w.toUpperCase() ? anyCase : reEsc);
function highlighter(geneWords, termWords) {
  const alt = (ws, f) => [...new Set(ws.filter((w) => w && w.length > 1))].sort((a, b) => b.length - a.length).map(f).join("|") || "(?!)";
  const re = new RegExp(`(?<![\\p{L}\\p{N}])(?:(${alt(geneWords, geneCase)})|(${alt(termWords, anyCase)}))(?![\\p{L}\\p{N}])`, "gu");
  return (text) => {
    if (!text) return "";
    let out = "", last = 0;
    for (const m of text.matchAll(re)) {
      out += esc(text.slice(last, m.index)) + `<mark class="${m[1] !== undefined ? "g" : "t"}">${esc(m[0])}</mark>`;
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  };
}
// PubTator sometimes tags plain words as the gene ("was" for WAS, "clock" for CLOCK): skip
// lower-case, digit-free spellings of the symbol ("tp53", zebrafish, is kept). Plus G.names: the
// symbol, aliases, previous symbols and HGNC names (a disease: name and synonyms). (app.py's named_pmids finds
// the papers naming the gene or disease the same way.)
const realMention = (m) => G.kind !== "gene" || !(m === m.toLowerCase() && !/\d/.test(m) && m.toUpperCase() === G.label.toUpperCase());
const hl = (p) => highlighter([...p.mentions.filter(realMention), ...G.names], p.term_words);

// ---- gene or disease search
// Clicking the first box's label flips what it searches for (and clears the search).
const MODES = {gene: {label: "Gene", placeholder: "symbol, alias or name", termHint: "disease or any words", examples: `
                 <a href="?gene=p53">p53</a>, <a href="?gene=BRCA">BRCA</a>,
                 <a href="?gene=ZCCHC8&amp;q=pulmonary+fibrosis&amp;rank=keyword">ZCCHC8 + pulmonary fibrosis (Rank by Keyword)</a>,
                 <a href="?gene=CFTR&amp;q=sweat+chloride&amp;rank=hybrid">CFTR + sweat chloride (Rank by Hybrid)</a>.`},
               disease: {label: "Disease", placeholder: "name, e.g. cystic fibrosis", termHint: "gene or any words", examples: `
                 <a href="?disease=cystic+fibrosis">cystic fibrosis</a>, <a href="?disease=Huntington+disease">Huntington disease</a>,
                 <a href="?disease=idiopathic+pulmonary+fibrosis&amp;q=telomeres&amp;rank=keyword">idiopathic pulmonary fibrosis + telomeres (Rank by Keyword)</a>,
                 <a href="?disease=Alzheimer+disease&amp;q=sleep&amp;rank=hybrid">Alzheimer disease + sleep (Rank by Hybrid)</a>.`}};
function showMode() {
  const m = MODES[MODE], to = MODE === "gene" ? "disease" : "gene";
  $("mode").textContent = `${m.label} ⇄`;
  $("mode").title = `Search by ${to} instead`;
  $("mode").setAttribute("aria-label", `${m.label} search. Switch to ${to} search`);
  $("subject").placeholder = m.placeholder;
  $("subject").setAttribute("aria-label", m.label);
  $("term").placeholder = m.termHint;
  $("examples").innerHTML = m.examples;
}
$("mode").onclick = () => {
  MODE = MODE === "gene" ? "disease" : "gene";
  Object.assign(S, {gene: "", disease: "", ot: "", ep: "", named: "", ymin: "", ymax: "", sort: "", match: "", topic: "",
                    ax: "", ay: "", pmid: "", page: 1});
  $("subject").value = ""; $("choices").innerHTML = ""; $("msg").innerHTML = "";
  writeURL(true); showMode(); clearGene();  // (writeURL first: it saves the place of the page being left)
  $("subject").focus();
};

let geneNo = 0;  // bumps on every lookup; an older answer arriving late is dropped
async function searchGene(push = true) {
  const q = S[MODE].trim(), my = ++geneNo, gene = MODE === "gene";
  $("choices").innerHTML = ""; $("msg").innerHTML = "";
  if (!q) { clearGene(); return; }
  let res;
  try { res = await getJSON(`/api/resolve?kind=${MODE}&q=` + encodeURIComponent(q)); }
  catch (e) { if (my === geneNo) { clearGene(); $("msg").innerHTML = `<p class="note">Error: ${esc(e.message)}</p>`; } return; }
  if (my !== geneNo) return;
  if (!res.matches.length) {
    clearGene(); $("msg").innerHTML = `<p>No ${MODE} found for <b>${esc(q)}</b>. ${gene
      ? "Try a symbol (e.g. CFTR), an alias or part of the name." : "Try another name (e.g. cystic fibrosis) or part of one."}</p>`;
    return;
  }
  if (res.matches.length === 1 && !res.partial) return loadGene(res.matches[0], res.also || [], push, false, my);
  clearGene();
  $("choices").innerHTML = (res.partial
      ? `<h2>No exact match for “${esc(q)}”. Did you mean:</h2>` + (gene
        ? `<p class="hint">Only human (HGNC) genes are listed. For a mouse or rat gene, type the human symbol (e.g. TP53 for Trp53).</p>` : "")
      : `<h2>${fmt(res.matches.length)} ${MODE}s match “${esc(q)}”. Pick one:</h2>`) +
    res.matches.map((g, i) => `<button data-i="${i}"><b>${esc(g.label)}</b> &nbsp;${gene ? esc(g.name) : `<span class="muted">${esc(g.id)}</span>`}
       <span class="muted">· ${esc(g.why)} · ${fmt(g.n_papers)} papers</span></button>`).join("") +
    (res.n_more ? `<p class="muted">…and ${fmt(res.n_more)} more. Type more letters to narrow it down.</p>` : "");
  $("choices").querySelectorAll("button").forEach((b) => b.onclick = () => {
    $("choices").innerHTML = "";
    loadGene(res.matches[+b.dataset.i], [], true, true, ++geneNo);
  });
  return true;  // (drawn: a reload comes back to the same place in the list)
}

// reqNo++: also stops polls for the old gene's results; geneNo++: and a lookup still on its way
function clearGene() {  // (the page is emptied: no floor, and from the top)
  reqNo++; geneNo++; G = null; M = null; clearTimeout(yearTimer); listTop = false;
  $("card").innerHTML = ""; $("dis").innerHTML = ""; setList("");
  document.body.style.minHeight = ""; scrollTo(0, 0);
}

function pubtator(g) {  // PubTator3's own search for the gene (NCBI Gene id) or disease (its first PubTator id)
  const id = g.kind === "gene" ? g.entrez && `@GENE_${g.entrez}` : g.pubtator[0] && `@DISEASE_${g.pubtator[0]}`;
  return id ? ext(`https://www.ncbi.nlm.nih.gov/research/pubtator3/docsum?text=${encodeURIComponent(id)}`, "PubTator3") : "PubTator3";
}
function cardHTML() {
  const counts = `<p><b>${fmt(G.n_tagged)}</b> papers tagged with this ${G.kind} by ${pubtator(G)}
       · <b>${fmt(G.n_curated_papers)}</b> curated papers (Open Targets)${G.n_epmc_only
       ? ` · <b>${fmt(G.n_epmc_only)}</b> more linked only by Europe PMC text mining · <b>${fmt(G.n_set)}</b> in all` : ""}</p>`;
  if (G.kind === "disease") {
    const syn = G.synonyms.slice(0, 10).join("; ") + (G.synonyms.length > 10 ? `; … (${G.synonyms.length - 10} more)` : "");  // (some hold commas)
    // PubTator's MeSH and OMIM ids for it, and its Open Targets page (unless it is only PubTator's)
    const ids = G.pubtator.map((id) => id.startsWith("MESH:") ? ext(`https://meshb.nlm.nih.gov/record/ui?ui=${id.slice(5)}`, `MeSH ${esc(id.slice(5))}`)
      : id.startsWith("OMIM:") ? ext(`https://omim.org/entry/${id.slice(5)}`, `OMIM ${esc(id.slice(5))}`) : esc(id));
    if (!G.pubtator.includes(G.id)) ids.unshift(ext(`https://platform.opentargets.org/disease/${G.id}`, esc(G.id)));
    return `<h1>${esc(G.name)}</h1>
      ${syn ? `<p>Also known as: ${esc(syn)}</p>` : ""}
      <p class="muted">${ids.join(" · ")}</p>${counts}`;
  }
  const otherNames = [G.aliases.length ? `Also known as: ${esc(G.aliases.join(", "))}` : "",
                      G.prev.length ? `Previous symbols: ${esc(G.prev.join(", "))}` : ""].filter(Boolean).join(" · ");
  // Location and locus group are HGNC's (NCBI Gene gives the same); each links to its source.
  const kind = !G.locus_group ? "" : G.entrez ? ext(`https://www.ncbi.nlm.nih.gov/gene/${G.entrez}`, `NCBI ${esc(G.locus_group)}`)
                                              : esc(G.locus_group);
  return `<h1>${esc(G.symbol)} <span class="nm">${esc(G.name)}</span></h1>
    ${otherNames ? `<p>${otherNames}</p>` : ""}
    <p class="muted">${[esc(G.location || ""), kind,
      ext(`https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/${G.hgnc_id}`, esc(G.hgnc_id))].filter(Boolean).join(" · ")}</p>
    ${counts}`;
}

async function loadGene(g, also, push, picked = false, my = geneNo) {
  // A pick from a list: a gene by its symbol, a disease by its id (names can be shared)
  if (picked) S[MODE] = g.kind === "gene" ? g.symbol : g.id;
  let gene;
  try { gene = await getJSON("/api/subject/" + encodeURIComponent(g.id)); }
  catch (e) { if (my === geneNo) { clearGene(); $("msg").innerHTML = `<p class="note">Error: ${esc(e.message)}</p>`; } return; }
  if (my !== geneNo) return;  // a newer lookup took over
  G = gene;
  if (picked || G.kind === "disease") $("subject").value = G.label;  // (a disease's name, not its id or a synonym)
  for (const d of [...G.curated, ...G.epmc]) DN[d.id] = d.name;
  $("card").innerHTML = cardHTML() +
    (also.length ? `<p class="muted">“${esc(S[MODE])}” is also ${G.kind === "gene" ? "an alias or old symbol" : "another name"} of:
       ${also.map((a) => `<a href="?${MODE}=${encodeURIComponent(a.kind === "gene" ? a.symbol : a.id)}">${esc(a.label)}</a>`).join(", ")}</p>` : "");
  renderDiseases();
  return show(push);  // (true once drawn, unless something newer took over)
}

// ---- facets: one box per source, the same look. For a gene they list diseases, for a disease
// genes (Open Targets links them both ways). Above them: only papers that name the gene or disease.
const SRC = {ot: ["OT", "Open Targets curated"], ep: ["ePMC", "Europe PMC text-mined"]};
const srcTag = (k) => `<span class="src ${k}" title="${SRC[k][1]}">${SRC[k][0]}</span>`;
const SOURCE_NAMES = {gene2phenotype: "Gene2Phenotype", genomics_england: "Genomics England", orphanet: "Orphanet",
                      uniprot_literature: "UniProt"};
const sources = (list) => list.map((s) => SOURCE_NAMES[s] || s).join(", ");

const EPMC_TOP = 50;  // text-mined items listed per box
// fc: counts within the other filters (rows = the items with papers there, most first), "wait"
// while they load, or null when no filter is set (the subject's totals and lists).
const BOX = {gene: "", rows: {}, total: {}, all: {}, open: {}};  // per box: last rows drawn and whether "more" is open
function facetHTML(k, fc) {
  const ot = k === "ot", items = ot ? G.curated : G.epmc, Other = other()[0].toUpperCase() + other().slice(1);
  let list = items, nAll = ot ? G.n_curated_papers : G.n_epmc_papers, total = ot ? items.length : G.n_epmc_items;
  const counting = fc === "wait" && !BOX.rows[k], stale = fc === "wait";  // counting: nothing drawn yet for this subject
  if (stale) {  // new counts on the way: the rows and counts drawn last, faded (rows that jumped would
    list = BOX.rows[k] || []; nAll = BOX.all[k] ?? null; total = BOX.total[k] ?? 0;  // move under the mouse)
  }
  else if (fc) {
    const at = Object.fromEntries(items.map((d, i) => [d.id, i]));
    const ids = Object.keys(fc[k]).filter((id) => id !== "any")
      .sort((a, b) => fc[k][b] - fc[k][a] || (at[a] ?? 1e9) - (at[b] ?? 1e9) || a.localeCompare(b));
    total = ids.length;
    list = ids.slice(0, ot ? ids.length : EPMC_TOP).map((id) => ({id, name: dname(id), n_papers: fc[k][id],
                                                                   sources: items[at[id]]?.sources}));
    nAll = fc[k].any;
  }
  if (!stale) [BOX.rows[k], BOX.total[k], BOX.all[k]] = [list, total, nAll];
  const row = (id, name, n, title) => `<li><button type="button" data-facet="${k}" data-id="${esc(id)}" data-name="${esc(name)}"
      aria-pressed="${S[k] === id}"${n === 0 ? ` class="zero"` : ""}${title ? ` title="${esc(title)}"` : ""}>
      <span${id === "any" ? ` class="any"` : ""}>${esc(name)}</span><span class="n">${n == null ? "" : fmt(n)}</span></button></li>`;
  const rows = (ds) => ds.map((d) => row(d.id, d.name, d.n_papers, d.sources && `Curated by ${sources(d.sources)}`)).join("");
  const top = list.slice(0, 12), rest = list.slice(12);
  // An item picked from a paper may be outside the list: show it, picked, under "Any".
  const off = S[k] && S[k] !== "any" && !list.some((d) => d.id === S[k])
    ? row(S[k], dname(S[k]), fc && fc !== "wait" ? fc[k][S[k]] ?? 0 : null) : "";
  const shown = total > list.length ? ` (top ${list.length} of ${fmt(total)})` : "";
  const open = BOX.open[k] || rest.some((d) => d.id === S[k]);
  const otPage = G.kind === "gene" ? G.ensembl && `target/${G.ensembl}` : !G.pubtator.includes(G.id) && `disease/${G.id}`;
  return `<section class="facet ${k}${stale ? " stale" : ""}" aria-labelledby="fh-${k}">
    <h2 id="fh-${k}">${srcTag(k)} ${ot ? "Curated" : "Text-mined"} ${other()}s</h2>
    <p class="sub">${ot ? `Open Targets curators: Orphanet, Gene2Phenotype, Genomics England, UniProt.
        ${otPage ? ext(`https://platform.opentargets.org/${otPage}`, "Open Targets page") : ""}`
      : "Europe PMC text mining, via Open Targets."}</p>
    ${counting ? `<ul class="dlist">${row("any", `Any ${other()}`, null)}${off}</ul><p class="hint">Counting…</p>`
      : list.length || off || nAll || S[k] ? `<ul class="dlist">${row("any", `Any ${other()}`, nAll)}${off}${rows(top)}</ul>
      ${rest.length ? `<details class="more" data-box="${k}"${open ? " open" : ""}>
        <summary>${rest.length} more${shown}</summary><ul class="dlist">${rows(rest)}</ul></details>` : ""}`
      : `<p class="muted">None ${fc && items.length ? "within your other filters" : `for ${esc(G.label)}`}.</p>`}
  </section>`;
}
// Only the papers whose title or abstract names the gene (its symbol, an alias or old symbol, or a
// name PubTator3 found for it in that paper) or the disease (name, synonym, or PubTator3's word for
// it there). n: how many, within the other filters (null while counting).
const namedTitle = () => S.named ? "Click to show all papers again."
  : `Show only papers naming ${G.label} (or ${G.kind === "gene" ? "an alias" : "a synonym"}) in the title or abstract.`;
function namedHTML(n, stale) {
  return `<section class="facet nm${stale ? " stale" : ""}" aria-labelledby="fh-nm">
    <h2 id="fh-nm">Named in the abstract</h2>
    <p class="sub">PubTator3 also tags papers that name the ${G.kind} only in the full text, or link it by curation or MeSH.</p>
    <ul class="dlist"><li><button type="button" data-named aria-pressed="${!!S.named}" title="${esc(namedTitle())}">
      <span>${esc(G.label)} in the title or abstract</span><span class="n">${n == null ? "" : fmt(n)}</span></button></li></ul>
  </section>`;
}

let FC = null;  // box counts within the other filters, for FC.key
const keyWords = () => S.q.trim() && rank() === "keyword" ? S.q.trim() : "";  // keyword words filter the list; others only rank it
const facetKey = () => [G?.id, S.ot, S.ep, S.named, keyWords(), S.match, S.ymin, S.ymax].join("|");
function renderDiseases() {
  if (!G) return;
  // Counts are fetched always (the named box's count comes only from there); the facet boxes use
  // them once a filter is set, else the subject's totals.
  const filtered = S.ot || S.ep || S.named || S.ymin || S.ymax || keyWords(), key = facetKey();
  if (FC?.key !== key)
    getJSON("/api/facets?" + new URLSearchParams({subject: G.id, ot: S.ot, ep: S.ep, named: S.named ? 1 : 0, term: keyWords(),
                                                  match: S.match || "all", rank: rank(), ymin: S.ymin || 0, ymax: S.ymax || 0})).then((fc) => {
      if (FC?.key === key || facetKey() !== key) return;  // already drawn, or the filters moved on
      const named = Object.keys(fc.names).some((id) => DN[id] !== fc.names[id]);
      Object.assign(DN, fc.names);
      FC = {key, ...fc};
      renderDiseases();
      const bar = document.querySelector("#list .filters");  // a filter chip may still show a bare id
      if (named && bar) holdStill(document.querySelector("#list .lbar"), () => { bar.outerHTML = filtersHTML(); wireTop(); });
    }).catch(() => {});
  const have = FC?.key === key, fc = !filtered ? null : have ? FC : "wait";
  const lastNamed = FC?.key.split("|")[0] === G.id ? FC.named : null;  // (while counting: the last count, faded)
  // (In one column the boxes sit above the results: those are held still as the boxes change, wherever the mouse is
  // outside the boxes. In two columns the results don't move then: nothing to do.)
  const lbar = $("list"), hold = {below: false};
  if (BOX.gene === G.id && disBusy() && holdStill(lbar, () => patchDiseases(fc, have, lastNamed), hold)) return;
  disLater = false;
  const again = BOX.gene === G.id && $("dis").firstElementChild;  // (the first draw for a subject holds nothing)
  if (BOX.gene !== G.id) Object.assign(BOX, {gene: G.id, rows: {}, total: {}, all: {}, open: {}});
  const f = document.activeElement?.closest?.("#dis [data-facet], #dis [data-named]");  // keep keyboard focus on the row
  holdStill(again ? lbar : null, () => {
    keepFloor();
    $("dis").innerHTML = namedHTML(lastNamed, !have) + facetHTML("ot", fc) + facetHTML("ep", fc) + `<p class="hint">${disHint(fc)}</p>`;
    dropBlankFloor();
  }, hold);
  if (f) $("dis").querySelector(f.dataset.named != null ? "[data-named]"
    : `[data-facet="${f.dataset.facet}"][data-id="${CSS.escape(f.dataset.id)}"]`)?.focus({preventScroll: true});
}
const disHint = (fc) => `${isMap() ? `Hover over a ${other()} to grey out the other papers on the map; click to keep that.`
  : `Click a ${other()} to show only its papers${keyWords() ? " (clears the keyword words)" : ""}.`} Pick one in each box = papers in
  both. ${fc ? "Counts are within your other filters." : ""}`;
// The user is working in the boxes: the mouse is over them, or the keyboard is in them. (Not a row that keeps the
// focus after a mouse click: the boxes are sorted once the mouse leaves.)
const disBusy = () => $("dis").matches(":hover") || !!$("dis").querySelector(":focus-visible");
// While the mouse is over the boxes (or the keyboard is in them), a redraw only changes the rows' counts, fading and

  $("csv").href = "/api/papers.csv?" + apiParams();
  $("csv").textContent = `Download CSV (all ${fmt(r.n_matched)}${r.n_matched > 50000 ? `, about ${fmt(Math.round(r.n_matched / 2000))} MB` : ""})`;
}

function scoreText(p) {
  if (rank() === "semantic" && p.sim != null) return `semantic match ${p.sim.toFixed(2)}`;
  if (rank() === "hybrid" && (p.kw_rank || p.sem_rank))
    return `${p.kw_rank ? `keyword rank ${fmt(p.kw_rank)}` : "no keyword match"} · ${p.sem_rank ? `semantic rank ${fmt(p.sem_rank)}` : "no semantic score"}`;
  return p.bm25 != null ? `keyword score ${p.bm25}` : "";
}

// Why a paper whose title and abstract don't name the gene (or disease) is listed: each source that links it.
// p.via: the curated sources PubTator3 merges into its tags (no words in the text).
const VIA = {MESH: "MeSH indexing", gene2pubmed: "NCBI’s gene2pubmed", generifs_basic: "a GeneRIF",
             gene_interactions: "NCBI’s gene interactions"};
const andList = (xs) => xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs.at(-1)}`;
// up to 3 words in quotes, one per spelling ignoring case: “AQP4”, “aquaporin-4” and 2 more
const quoted = (ms) => {
  const uniq = [...new Map(ms.map((m) => [m.toLowerCase(), m])).values()];
  return andList([...uniq.slice(0, 3).map((m) => `“${esc(m)}”`), ...(uniq.length > 3 ? [`${uniq.length - 3} more`] : [])]);
};
// A paper not in the local PubMed copy (no title here) says so instead, as the page can't look in its text.
function notNamedHTML(p) {
  // A word PubTator3 tagged that the page looks for and did not find in the title or abstract is in the full text.
  // It does not look for one-letter words, or lower-case spellings of a gene's symbol ("clock" for CLOCK).
  const looked = (m) => realMention(m) && m.length > 1;
  const why = [], via = p.via || [], words = p.mentions.filter(looked), other = p.mentions.filter((m) => !looked(m));
  if (words.length) why.push(`It was tagged ${p.title ? "in the full text " : ""}by PubTator3 (as ${quoted(words)}).`);
  else if (other.length) why.push(`PubTator3 tagged ${quoted(other)} as ${esc(G.label)}.`);
  if (via.length) why.push(`It was linked by ${andList(via.map((v) => esc(VIA[v] || v)))} (via PubTator3).`);
  if (p.curated.length) why.push(`It was linked by Open Targets curation (${esc(sources([...new Set(p.curated.flatMap((c) => c.sources))]))}).`);
  if (p.epmc.length) why.push(`It was linked to ${p.epmc.length === 1 ? esc(p.epmc[0].name)
    : `${p.epmc.length} ${G.kind === "gene" ? "diseases" : "genes"}`} by Europe PMC text mining.`);
  if (!why.length) why.push("It was linked by curation or MeSH indexing (via PubTator3).");  // (a server without p.via)
  const lead = p.title ? `${esc(G.label)} is not named in the title or abstract.` : "Its title and abstract are not in the local PubMed copy.";
  return `<div class="hint">${lead} ${why.join(" ")}</div>`;
}

const EP_SHOWN = 6;  // text-mined chips shown per paper before "+N more"
function paperHTML(p, h) {
  const url = `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`;
  const tag = p.abstract ? "" : '<span class="tag">no abstract</span>';
  const title = p.title ? h(p.title) + tag : `<a href="${url}" target="_blank" rel="noopener">PMID ${p.pmid}</a>${tag}`;
  const abs = p.abstract ? h(p.abstract) : "";
  const named = (title + abs).includes('<mark class="g">');
  const meta = [p.journal && esc(p.journal), p.year, p.title && `<a href="${url}" target="_blank" rel="noopener">PMID ${p.pmid}</a>`,
                S.q.trim() && scoreText(p)].filter(Boolean).join(" · ");
  const link = (k, d, why) => `<button type="button" class="dchip ${k}" data-facet="${k}" data-id="${esc(d.id)}"
      data-name="${esc(d.name)}" aria-pressed="${S[k] === d.id}" title="${esc(`${why} ${S[k] === d.id
        ? "Click to show all papers again." : `Click to show only these papers for ${G.label} + ${d.name}.`}`)}">${srcTag(k)}${esc(d.name)}</button>`;
  const first = (ds, k) => [...ds.filter((d) => S[k] === d.id), ...ds.filter((d) => S[k] !== d.id)];  // the picked one
  const ot = first(p.curated, "ot").map((c) => link("ot", c, `Open Targets curated (${sources(c.sources)}).`));
  const ep = first(p.epmc, "ep").map((d) => link("ep", d, "Europe PMC text-mined link."));
  const links = [...ot, ...ep.slice(0, EP_SHOWN)].join("") + (ep.length > EP_SHOWN
    ? `<details class="tags"><summary>+${ep.length - EP_SHOWN} more text-mined</summary>${ep.slice(EP_SHOWN).join("")}</details>` : "");
  const chip = (d) => `<span class="chip" title="PubTator: ${esc(d.id)} ${esc(d.canonical)}">${esc(d.name)}</span>`;
  const inAbs = p.diseases.filter((d) => d.in_abstract), other = p.diseases.filter((d) => !d.in_abstract);
  const chips = inAbs.map(chip).join("") + (other.length
    ? `<details class="tags"><summary>${inAbs.length ? "+" : ""}${other.length} disease tag${other.length === 1 ? "" : "s"} from full text / MeSH</summary>${other.map(chip).join("")}</details>`
    : "");
  return `<li>
    <div class="title">${title}</div>
    ${meta ? `<div class="meta">${meta}</div>` : ""}
    ${links ? `<div>${links}</div>` : ""}
    ${chips ? `<div>${chips}</div>` : ""}
    ${named ? "" : notNamedHTML(p)}
    ${abs ? `<details class="abs"><summary>Abstract</summary><p class="abstract">${abs}</p></details>` : ""}
  </li>`;
}

function pager(r) {
  if (r.n_pages <= 1) return "";
  const b = (p, label, dis) => `<button data-p="${p}" ${dis ? "disabled" : ""}>${label}</button>`;
  return `<nav class="pager">${b(1, "« First", r.page === 1)}${b(r.page - 1, "‹ Previous", r.page === 1)}
    <span>Page ${fmt(r.page)} of ${fmt(r.n_pages)}</span>
    ${b(r.page + 1, "Next ›", r.page === r.n_pages)}${b(r.n_pages, "Last »", r.page === r.n_pages)}</nav>`;
}

// ---- literature map (Map and Map Explorer tabs)
// Categorical slots in fixed order (validated: CVD-safe adjacent pairs; light hues need the direct

const SLOTS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
const NOISE = "#d6d5cf", INK = "#0b0b0b", FONT = "Atkinson Hyperlegible, Verdana, sans-serif";
// The year colour bar on the maps without axes: inside the map's bottom right corner, so the plot area keeps its size in
// every colouring (a narrower one moved every dot, and the kept zoom crept outwards with each switch).
const YEAR_BAR = {title: {text: "Year"}, thickness: 14, len: 0.45, x: 1, xanchor: "right", xpad: 12, y: 0, yanchor: "bottom", ypad: 12,
                  bgcolor: "rgba(255,255,255,0.85)"};
const topicColour = (c) => c < 1 ? NOISE : SLOTS[(c - 1) % SLOTS.length];
const DRILL_MIN = 30;  // smallest topic offered a map of its own
// Map Explorer's plot margins: fixed, with room for the year colour bar in both colourings (so a glide starts and ends

const exMargin = () => ({l: 74, r: 96, t: 12, b: 64, autoexpand: false});
const AXES_HINT = "Across: how close each paper is in meaning to your words, or to a topic’s centre. Up: how close to the second, beyond the first. Short words work best, e.g. “mouse model”. Or let the map find two directions itself.";
// Suggested axes (axes.py): found from the papers themselves, each end named from the papers near it
const AUTO = {discover: "Discover", spread: "Main spread", ontopic: "About it ↔ in passing"};
const autoKind = (spec) => /^auto:(\w+)$/.exec(spec || "")?.[1];
const AUTO_NOTE = {
  discover: (s) => `Discover: the two directions in which these papers differ most, compared with gene papers in general, leaving out how much each one is about ${s}.`,
  spread: () => "Main spread: the two directions in which these papers differ most (principal components).",
  ontopic: (s) => `Across: how much each paper is like the rest of this map (right) rather than like gene papers in general (left); papers far left often mention ${s} only in passing. Up: Discover’s first direction.`,
};
let M = null;          // the map from /api/map (+ params, secs)
let EX = null;         // Map Explorer positions for M: {id, ax, ay, x, y, angle, range}
let MORPH = null;      // in-between positions (in EX's units) while the dots glide onto new axes
let mapColour = "topic", mapFocus = 0, hoverFocus = 0, lastHoverC = 0, shiftHeld = false, mapYear = null, playing = false, zoomK = 1;
let drawn = {rev: "", cur: [], big: 11, annotations: []};  // what drawMap drew last

let mapTop = false;    // the next map drawn is scrolled into view (a drill-in, clicked in the topic list under the map)

function loadPlotly() {
  if (window.Plotly) return Promise.resolve();

    s.src = "https://cdn.plot.ly/plotly-2.35.2.min.js"; s.onload = ok; s.onerror = () => fail(new Error("could not load plotly.js"));
    document.head.appendChild(s);
  });
}

async function loadMap(push = true) {
  takeYear();
  if (push) restoreY = null;
  writeURL(push);
  playing = false;
  const my = ++reqNo, t0 = performance.now();
  const head = () => tabsHTML() + filtersHTML();
  const params = mapParams();
  $("how").innerHTML = howHTML();
  let r = M && M.params === params ? M : null;  // switching between Map and Map Explorer, or a facet: same map
  const toPlot = mapTop, toTop = listTop, seen = inputs;  // (a drill-in: show the new map once drawn; a new search: its top)
  mapTop = listTop = false;
  if (!r) {
    const faded = fadeMap("<b>Making the map…</b>");
    if (!faded) { setList(head() + `<p class="status"><b>Making the map…</b></p>`); wireTop(); }
    try {
      [r] = await Promise.all([
        poll("/api/map?" + params, my, (pr, n) => {
          if (faded && $("plot")) document.querySelector("#list .status").innerHTML = progressLine(pr, n);
          else { setList(head() + progressHTML(pr, n)); wireTop(); }
        }),
        loadPlotly()]);
    } catch (e) {  // a drill-in link can outlive its map (topics renumbered): offer the way back up
      if (my !== reqNo) return;  // (a stale request's error)
      setList(head() + `<p class="note">${S.topic && e.message.startsWith("404") ? "That topic is not on this map any more."
          : `Error: ${esc(e.message)}`}</p>
        ${S.topic ? `<p><button type="button" data-crumb="">Show the map of all the papers</button></p>` : ""}`);
      wireTop(); wireCrumbs(); showListTop(); return;
    }
    if (!r) return;
    Object.assign(r, {params, secs: ((performance.now() - t0) / 1000).toFixed(1)});
  }
  if (my !== reqNo) return;
  $("how").innerHTML = howHTML();
  if (M !== r) {  // a different map
    // Topic axes name this map's topics: drop them when you move to another map, but not on
    // Back/Forward (push false), where the URL's axes go with the URL's map.
    if (M && push && M.key !== r.key) {
      for (const k of ["ax", "ay"]) if (S[k].startsWith("topic:")) S[k] = "";
      S.pmid = "";
    }
    writeURL(false);
    M = r; EX = null; MORPH = null;
    mapFocus = hoverFocus = 0; mapYear = null;
  }
  const path = r.path || [];
  const all = r.sampled ? `All papers (a sample of ${fmt(r.n_shown)})` : `All ${fmt(r.n_text)} papers`;
  const crumbs = path.length ? `<nav class="crumbs" aria-label="Drill-in path">
      <button type="button" data-crumb="">${all}</button>
      ${path.map((p, i) => ` › ${i < path.length - 1
        ? `<button type="button" data-crumb="${path.slice(0, i + 1).map((q) => q.id).join(".")}">${p.id}. ${esc(p.name)}</button>`
        : `<b>${p.id}. ${esc(p.name)}</b>`}`).join("")}</nav>` : "";
  if (r.too_few) {
    const few = path.length ? path.at(-1).n : r.n_text;
    setList(head() + crumbs + `<p class="status">${few ? `Only ${plural(few, "paper")}` : "No papers"} with an abstract here:
      too few for a map. ${path.length ? "Go back up above" : "Remove a filter, or use the list"}.</p>`);
    wireTop(); wireCrumbs(); showListTop(); return;
  }
  const n = r.pmid.length, noise = r.c.filter((c) => c < 1).length, explore = S.view === "explore";
  const within = path.length ? ` in topic “${esc(path.at(-1).name)}”` : "";
  const sample = !r.sampled ? ""
    : path.length ? ` These are the topic’s papers in a fixed sample of ${fmt(r.n_shown)} of the ${fmt(r.n_text)} papers.`
    : ` A fixed sample of ${fmt(n)} of the ${fmt(r.n_text)} papers (more would be slow); the same sample each time.`;
  const left = !path.length && r.n_list - r.n_text ? ` ${plural(r.n_list - r.n_text, "paper")} not in the local PubMed copy left out.` : "";
  const [y0, y1] = yearSpan();
  if (explore && !(S.ax && S.ay)) EX = null;  // (Back to a page with no axes: no axes)
  setList(head() + `
    <p class="status">${explore ? "Map Explorer" : "Map"} of <b>${fmt(n)}</b>${!path.length && n < r.n_list ? ` (out of ${fmt(r.n_list)})` : ""} ${scopeText(n, false)}${within}:
      ${r.clusters.length ? `<b>${r.clusters.length}</b> ` : "no clear "}${path.length ? "sub-topics" : "topics"} · ${fmt(noise)} in no clear topic (grey) · ${r.secs} s ${infoBtn()} <span id="maskNote">${maskText()}</span></p>
    ${crumbs}
    <p class="hint" style="max-width:75ch">Dot = paper; close dots are close in meaning. Ring = curated paper. Click a dot to read it.
      Hold <kbd>Shift</kbd> over a dot to pick out its topic; <kbd>Esc</kbd> clears. Hover over a box on the left to grey out
      the papers it leaves out; click to keep that.${sample}${left}
      ${r.named_by === "llm" ? "Topic names: AI (Gemini Flash-Lite)." : "Topic names: each topic’s most distinctive words."}</p>
    ${explore ? axesHTML(r) : ""}
    <div class="bar">
      <span>Colour by <span class="seg" role="group" aria-label="Colour by">
        <button type="button" data-colour="topic" aria-pressed="${mapColour === "topic"}">Topic</button>
        <button type="button" data-colour="year" aria-pressed="${mapColour === "year"}">Year</button></span></span>
      ${y1 > y0 ? `<span class="years"><button type="button" id="play" aria-pressed="false">▶ Play years</button>
        <input type="range" id="yr" min="${y0}" max="${y1}" value="${mapYear ?? y1}" aria-label="Show the papers up to this year">
        <span id="yrNote" aria-live="polite"></span></span>` : ""}
    </div>
    <div id="plot" role="img" aria-label="Literature map: ${fmt(n)} papers in ${r.clusters.length} topics. The topic list below gives the same information."></div>
    <p id="hiddenNote" class="hint"></p>
    <div id="mappaper">${keptPaper(r.pmid)}</div>
    <h2>${path.length ? "Sub-topics" : "Topics"} <span class="muted" style="font-weight:normal">(click one to pick it out on the map)</span></h2>
    <ol class="topics">${r.clusters.map((c) => `<li><button type="button" data-topic="${c.id}" class="${mapFocus === c.id ? "on" : ""}">
        <span class="sw" style="background:${topicColour(c.id)}"></span>
        <span><b>${c.id}. ${esc(c.name)}</b> <span class="muted">· ${plural(c.n, "paper")}</span>
        <span class="terms">${esc(c.terms.join(", "))}</span></span></button>
        ${c.n >= DRILL_MIN ? `<button type="button" class="drill" data-drill="${c.id}" title="Make a new map of only these ${fmt(c.n)} papers">Drill in</button>` : ""}</li>`).join("")}
      ${noise ? `<li><button type="button" data-topic="-1" class="${mapFocus === -1 ? "on" : ""}"><span class="sw" style="background:${NOISE}"></span>
        <span><b>No clear topic</b> <span class="muted">· ${plural(noise, "paper")}</span></span></button></li>` : ""}</ol>`);
  wireTop(); wireCrumbs();
  document.querySelectorAll("[data-colour]").forEach((b) => b.onclick = () => {
    mapColour = b.dataset.colour;
    document.querySelectorAll("[data-colour]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    drawMap();
  });
  document.querySelectorAll("[data-topic]").forEach((b) => b.onclick = () => {
    const c = +b.dataset.topic;
    setFocus(mapFocus === c ? 0 : c);
    showPlot();
  });
  document.querySelectorAll("[data-drill]").forEach((b) => b.onclick = () => {
    S.topic = [...path.map((q) => q.id), b.dataset.drill].join(".");
    mapTop = true;
    loadMap(true);
  });
  syncChips();
  if (toPlot && inputs === seen) $("plot").scrollIntoView({block: "nearest"});  // at once, with the new map (not after its axes)
  else if (toTop && inputs === seen) showListTop();
  // Room for the longest texts these two notes can have on this map, so they never wrap the line they are on
  roomFor($("maskNote"), `· ${fmt(n)} highlighted by the facets`);
  if ($("play")) {
    const most = Math.max(...Object.values(M.year.reduce((c, y) => (c[y] = (c[y] || 0) + 1, c), {})));
    roomFor($("yrNote"), `Up to ${y1}: ${fmt(n)} papers (${fmt(most)} new)`);
    $("play").onclick = play;
    $("yr").oninput = (e) => { playing = false; setYear(+e.target.value >= y1 ? null : +e.target.value); };
    syncYear();
  }
  placeBack();  // (once the page has its final layout)
  if (explore) wireAxes();
  const paper = openURLPaper(r.pmid, push);
  loadMapFacets(r);
  if (explore && S.ax && S.ay) await loadAxes(false);
  else drawMap();
  if (!push) await paper;  // (Back or Forward: the place to go back to may be in the paper)
  return my === reqNo;
}

// ---- facets on the map: which papers each facet row links (positions in M.pmid), loaded once per
// map; picked (S) or hovered over (hoverPick), the papers they leave out are greyed out.
function loadMapFacets(r) {
  if (r.facets || r.facetsLoading || !r.key) return;
  r.facetsLoading = true;
  getJSON("/api/map_facets?" + new URLSearchParams({subject: G.id, key: r.key})).then((f) => {
    r.facets = f;
    addNames(f.names);
    if (M === r && isMap()) { updateFilterBar(); redraw(); }
  }).catch(() => { r.facetsLoading = false; });
}
// How many papers the facets highlight (written at the end of the status line, in room kept for it)
function maskText(sel = facetMask()) {
  return sel ? `· ${fmt(sel.reduce((a, v) => a + v, 0))} highlighted by the facets`
    : (S.ot || S.ep || S.named) && !M.facets ? "· highlighting…" : "";
}
function facetMask() {  // 1 = kept by the picked (and hovered) facets; null = none picked (or not loaded yet)
  const F = M?.facets, st = {...S, ...hoverPick}, parts = [];
  if (!F) return null;
  for (const k of ["ot", "ep"]) if (st[k]) parts.push(st[k] === "any" ? Object.values(F[k]).flat() : F[k][st[k]] || []);
  if (st.named) parts.push(F.named);
  if (!parts.length) return null;
  const on = new Uint8Array(M.pmid.length);
  parts.forEach((idx, j) => { for (const i of idx) if (on[i] === j) on[i] = j + 1; });  // in every part
  return on.map((v) => +(v === parts.length));
}
let drawing = null, drawAgain = false;
function redraw() {  // drawMap, at most one at a time (hovering down the facet rows asks for many)
  if (drawing) { drawAgain = true; return; }
  drawing = drawMap().finally(() => { drawing = null; if (drawAgain) { drawAgain = false; redraw(); } });
}

function wireCrumbs() {
  document.querySelectorAll("[data-crumb]").forEach((b) => b.onclick = () => { S.topic = b.dataset.crumb; loadMap(true); });
}

function setFocus(c) {
  mapFocus = c;
  document.querySelectorAll("[data-topic]").forEach((x) => x.classList.toggle("on", +x.dataset.topic === mapFocus));
  drawMap();
}

// ---- years: a slider and a Play button; papers appear year by year, still coloured by topic
function yearSpan() {  // from the 1st percentile year (skip a few very old papers) to the newest
  const ys = M.year.filter((y) => y > 0).sort((a, b) => a - b);
  return ys.length ? [ys[Math.floor(ys.length * 0.01)], ys.at(-1)] : [0, 0];
}
function syncYear() {
  const note = $("yrNote");
  if (!note) return;
  $("yr").value = mapYear ?? $("yr").max;
  $("play").textContent = playing ? "❚❚ Pause" : "▶ Play years";
  $("play").setAttribute("aria-pressed", playing);
  if (mapYear == null) { note.textContent = "All years"; return; }
  let upTo = 0, now = 0;
  for (const y of M.year) { if (y > 0 && y <= mapYear) upTo++; if (y === mapYear) now++; }
  note.textContent = `Up to ${mapYear}: ${fmt(upTo)} papers (${fmt(now)} new)`;
}
function setYear(y) { mapYear = y; syncYear(); return drawMap(); }
let playRun = 0;
async function play() {  // one year every ~half second; at the end, back to all years
  if (playing) { playing = false; syncYear(); return; }
  const [y0, y1] = yearSpan(), my = reqNo, map = M, run = ++playRun;
  const live = () => playing && run === playRun && my === reqNo && M === map;
  let y = mapYear == null || mapYear >= y1 ? y0 : mapYear + 1;
  playing = true; syncYear();
  while (live() && y <= y1) {
    await setYear(y++);
    await sleep(450);
  }
  if (!live()) return;
  playing = false; syncYear();
  await sleep(1000);
  if (run === playRun && !playing && M === map && mapYear === y1) setYear(null);
}

// ---- Map Explorer: put the papers on two axes of your choosing
// Ready-made axes in each "or a topic" list: the map's own direction ('about', from the server) and your rank-by words
const ABOUT_AXIS = "map:about", RANK_AXIS = "\nrank-by";  // (a text box can hold no line break, so no axis of your own is ever this)
const rankWords = () => S.q.trim();
function axesHTML(r) {
  // with no axes of your own yet: across = about it ↔ in passing (it needs the whole-PubMed vectors), up = your
  // rank-by words (if any)
  const about = r.source === "full";
  const own = (k) => S[k] && !autoKind(S[k]) ? S[k] : k === "ax" ? (about ? ABOUT_AXIS : "") : rankWords();
  const picked = (k) => own(k) === rankWords() && rankWords() ? RANK_AXIS : own(k);
  const text = (k) => /^topic:/.test(picked(k)) || [ABOUT_AXIS, RANK_AXIS].includes(picked(k)) ? "" : own(k);
  const opt = (k, v, label) => `<option value="${esc(v)}"${picked(k) === v ? " selected" : ""}>${label}</option>`;
