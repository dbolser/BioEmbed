    // shiftHeld, not ev.event.shiftKey: a redraw replays the last mouse event, Shift and all
    const want = shiftHeld && !typing() ? lastHoverC : 0;
    if (want !== hoverFocus) { hoverFocus = want; setTimeout(drawMap); return; }
    const j = drawn.cur.indexOf(i);
    if (i >= 0 && !(q.data.name === "curated" && q.pointNumber === j)) Plotly.Fx.hover(el, [{curveNumber: hit, pointNumber: j}]);
  });
  el.on("plotly_unhover", () => { lastHoverC = 0; });
  wireDotClick(el, (ev) => { const j = curatedAt(ev.event); return j >= 0 ? M.pmid[j] : ev.points[0].customdata[4]; });
}
// A click on a dot opens its paper once it is clearly not half of a double-click, which resets the zoom (else the
// reset also opened the paper under the mouse, and the page scrolled to it). Plotly sends a click for each half.
// (Kept on el: a new view drawn between the halves, as axes arrive, wires the plot anew and Plotly sees one click.)
function wireDotClick(el, pmidOf) {
  el.on("plotly_click", (ev) => {
    clearTimeout(el._dotTimer);
    const last = el._dotAt;
    el._dotAt = ev.event?.timeStamp ?? performance.now();  // (when the button went down, not when the page got to it)
    if (el._dotAt - last < DBLCLICK) return;  // (the second half of a double-click)
    const pmid = pmidOf(ev), req = reqNo;
    el._dotTimer = setTimeout(() => { if (req === reqNo && el.isConnected) pickMapPaper(pmid); }, DBLCLICK);  // (not if the page moved on)
  });
  el.on("plotly_doubleclick", () => { clearTimeout(el._dotTimer); el._dotAt = performance.now(); });
}
const DBLCLICK = 300;  // ms: Plotly's double-click time

// A dot clicked on any map: its paper opens under the map, and goes in the URL (pmid=), so the link reopens it.
// A pmid= that isn't a dot on this map (a link edited by hand, or from another map) is dropped.
function openURLPaper(pmids, push) {
  if (!S.pmid) return;
  // (scrolled to on a link, not on Back or Forward; one that fails stays out, and the page is still put back)
  if (pmids.includes(+S.pmid)) return showMapPaper(S.pmid, fromLink && !push).catch((e) => console.error(e));
  S.pmid = "";
  writeURL(false);
}
function pickMapPaper(pmid) {
  S.pmid = String(pmid);
  writeURL(false);
  return showMapPaper(S.pmid, true);
}
let paperNo = 0;  // the newest paper asked for wins; a late answer for an older one, or after leaving the map, is dropped
// The last paper drawn under a map, put back at once when a map is drawn anew with it open (Back, a tab, a chip):
// it is fetched again, but meanwhile there is no gap where it goes.
// (Same subject and words only: their highlights are in it. Kept across a reload too.)
let lastPaper = {};
try { lastPaper = JSON.parse(sessionStorage.getItem("lastPaper")) || {}; } catch {}  // (storage blocked: start empty)
const keptPaper = (pmids) => S.pmid && lastPaper.pmid === S.pmid && lastPaper.key === `${G.id}|${S.q}` && pmids.includes(+S.pmid)
  ? lastPaper.html : "";
const syncChips = () => document.querySelectorAll("#mappaper [data-facet]")  // the open paper's chips show what is picked
  .forEach((b) => b.setAttribute("aria-pressed", S[b.dataset.facet] === b.dataset.id));
// scroll: show the paper (a dot clicked, or a link to it): an expected move, as the paper opens under the map
async function showMapPaper(pmid, scroll) {
  const my = ++paperNo, req = reqNo;
  const p = await getJSON(`/api/paper?subject=${encodeURIComponent(G.id)}&pmid=${pmid}&term=${encodeURIComponent(S.q)}`);
  if (my !== paperNo || req !== reqNo || !$("mappaper")) return;
  $("mappaper").innerHTML = `<ol class="papers">${paperHTML(p, hl(p))}</ol>`;
  $("mappaper").querySelector("details.abs")?.setAttribute("open", "");
  lastPaper = {pmid: String(pmid), key: `${G.id}|${S.q}`, html: $("mappaper").innerHTML};
  try { sessionStorage.setItem("lastPaper", JSON.stringify(lastPaper)); } catch {}  // (full or blocked: no matter)
  if (scroll) $("mappaper").scrollIntoView({behavior: "smooth", block: "nearest"});
}

// ---- PubMedBERT map and MedEmbed map: the list's papers placed on a fixed map of the literature
// (landscape.py), over a picture of its human-gene papers coloured by field (PubMedBERT) or cluster (MedEmbed).
const LAND_INK = "#16324f", LAND_BG_OPACITY = 0.6;
const LAND_YEARS = [[0, "#b7d3f6"], [0.5, "#3987e5"], [1, "#0d366b"]];
let L = null, LM = null, landColour = "plain", landFocus = -1, landZoom = 1, landAnn = [];
const LMS = {};  // map name -> meta
const landMap = () => S.view === "medmap" ? "medembed" : "pubmedbert";
const LAND = {
  pubmedbert: {title: "PubMedBERT map", unit: "field", units: "Fields", none: "No field (journal not labelled)",
    unitsNote: "from the journal; click one to pick it out on the map",
    about: (n) => `placed where the published PubMedBERT map of 23 million PubMed abstracts
      puts it (${ext("https://pmc.ncbi.nlm.nih.gov/articles/PMC11240179/", "González-Márquez et al., Patterns 2024")}); close dots are close in meaning.
      Behind them: the ${fmt(n)} papers about human genes, coloured by field (the journal’s; grey = no field).`,
    off: "newer than early 2024, or not in its data"},
  medembed: {title: "MedEmbed map", unit: "cluster", units: "Clusters", none: "No cluster",
    unitsNote: "found in 12 dimensions, named by their most typical genes; click one to pick it out on the map",
    about: (n) => `placed by a t-SNE of the search’s own MedEmbed embeddings of the ${fmt(n)} papers about
      human genes; close dots are close in meaning. Behind them: all those papers, coloured by 780 clusters found separately
      (12 dimension UMAP, HDBSCAN), named by their most typical genes.`,
    off: "not about a human gene, or not embedded yet"},
};
const fieldName = (f) => f === 0 ? `no ${LAND[landMap()].unit}` : LM.fields[f].name;

async function loadLand(push = true) {
  takeYear();
  if (push) restoreY = null;
  writeURL(push);
  const my = ++reqNo, t0 = performance.now();
  const head = () => tabsHTML() + filtersHTML();
  const mp = landMap(), T = LAND[mp];
  const params = apiParams({page: 1, sort: ""}).toString() + `&map=${mp}`;
  $("how").innerHTML = howHTML();
  LM = LMS[mp] || null;  // (each map has its own fields and extent)
  const toTop = listTop, seen = inputs;  // (before the papers are placed: the user scrolling meanwhile wins)
  listTop = false;
  if (!(L && L.params === params)) {
    if (!fadeMap("<b>Placing the papers…</b>")) { setList(head() + `<p class="status"><b>Placing the papers…</b></p>`); wireTop(); }
    let r, meta;
    try {
      [r, meta] = await Promise.all([getJSON("/api/landscape?" + params), LM || getJSON(`/api/landscape_meta?map=${mp}`), loadPlotly()]);
    } catch (e) { if (my === reqNo) { setList(head() + `<p class="note">Error: ${esc(e.message)}</p>`); wireTop(); showListTop(); } return; }
    if (my !== reqNo) return;  // (a newer request, e.g. the other map's tab, owns L and LM now)
    LM = LMS[mp] = meta;
    L = Object.assign(r, {params, secs: ((performance.now() - t0) / 1000).toFixed(1)});
    landFocus = -1;
  }
  const n = L.pmid.length, off = L.n_list - L.n_on;
  const counts = new Map();
  for (const f of L.f) counts.set(f, (counts.get(f) || 0) + 1);
  const fields = [...counts].filter(([f]) => f > 0).sort((a, b) => b[1] - a[1]);
  const sw = (f) => `<span class="sw" style="background:${LM.fields[f].colour}"></span>`;
  const item = (f, c, label) => `<li><button type="button" data-field="${f}" class="${landFocus === f ? "on" : ""}">${sw(f)}
      <span><b>${esc(label)}</b> <span class="muted">· ${plural(c, "paper")}</span></span></button></li>`;
  const open = keptPaper(L.pmid);
  // (a chip in the open paper picked: the paper stays under the mouse though the filter bar above may wrap)
  holdStill(open ? $("mappaper") : null, () => setList(head() + `
    <p class="status">${T.title} of <b>${fmt(n)}</b>${L.sampled ? ` (a fixed sample of the ${fmt(L.n_on)})` : ""} ${scopeText(n)}
      · ${off ? `${plural(off, "paper")} not on it (${T.off}) · ` : ""}${L.secs} s ${infoBtn()}</p>
    <p class="hint" style="max-width:75ch">Dot = paper, ${T.about(LM.n_human)}
      Ring = curated paper. Click a dot to read it; scroll to zoom; <kbd>Esc</kbd> clears a picked ${T.unit}.</p>
    <div class="bar">
      <span>Colour by <span class="seg" role="group" aria-label="Colour by">
        <button type="button" data-lcolour="plain" aria-pressed="${landColour === "plain"}">One colour</button>
        <button type="button" data-lcolour="field" aria-pressed="${landColour === "field"}">${T.unit[0].toUpperCase() + T.unit.slice(1)}</button>
        <button type="button" data-lcolour="year" aria-pressed="${landColour === "year"}">Year</button></span></span>
    </div>
    <div id="plot" role="img" aria-label="${T.title}: ${fmt(n)} papers over the human-gene literature. The ${T.unit} list below gives the same information."></div>
    <div id="mappaper">${open}</div>
    <h2>${T.units} <span class="muted" style="font-weight:normal">(${T.unitsNote})</span></h2>
    <ol class="topics">${fields.map(([f, c]) => item(f, c, LM.fields[f].name)).join("")}
      ${counts.get(0) ? item(0, counts.get(0), T.none) : ""}</ol>`), {again: () => $("mappaper")});
  wireTop();
  syncChips();
  if (toTop && inputs === seen) showListTop();
  document.querySelectorAll("[data-lcolour]").forEach((b) => b.onclick = () => {
    landColour = b.dataset.lcolour;
    document.querySelectorAll("[data-lcolour]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    drawLand();
  });
  document.querySelectorAll("[data-field]").forEach((b) => b.onclick = () => {
    setLandFocus(landFocus === +b.dataset.field ? -1 : +b.dataset.field);
    showPlot();
  });
  landZoom = 1;
  placeBack();
  const paper = openURLPaper(L.pmid, push);
  await drawLand();
  if (!push) await paper;
  return my === reqNo;
}

function setLandFocus(f) {
  landFocus = f;
  document.querySelectorAll("[data-field]").forEach((x) => x.classList.toggle("on", +x.dataset.field === f));
  drawLand();
}

function drawLand() {
  const el = $("plot");
  if (!el || !L || !window.Plotly || el.classList.contains("stale")) return Promise.resolve();
  const n = L.pmid.length, E = LM.extent;
  L.hover ??= L.pmid.map((p, i) => [wrap(pesc(L.title[i] || `PMID ${p}`)), L.year[i] || "no year",
    pesc(fieldName(L.f[i])), L.curated[i] ? " · curated" : "", p]);
  // Dots grow as you zoom in, less so when there are many (else a big gene's dots carpet the map).
  const base = n > 10000 ? 4 : n > 3000 ? 5.5 : 7, size = Math.min(n > 10000 ? 7 : 18, base * landZoom), big = Math.min(28, Math.max(11, base * 2) * landZoom);
  const dim = (i) => landFocus >= 0 && L.f[i] !== landFocus;
  const idx = (keep) => { const out = []; for (let i = 0; i < n; i++) if (keep(i)) out.push(i); return out; };
  const years = L.year.filter((y) => y > 0).sort((a, b) => a - b);
  const y0 = years[Math.floor(years.length * 0.1)] ?? 0, y1 = years[Math.floor(years.length * 0.98)] ?? 0;
  const colourOf = (ids) => landColour === "year"
    ? {color: ids.map((i) => L.year[i] || y0), colorscale: LAND_YEARS, cmin: y0, cmax: Math.max(y1, y0 + 1)}
    : landColour === "field" ? {color: ids.map((i) => L.f[i] === 0 ? "#9a9994" : LM.fields[L.f[i]].colour)}
    : {color: LAND_INK};
  const trace = (ids, marker, extra = {}) => ({
    type: "scattergl", mode: "markers", x: ids.map((i) => L.x[i]), y: ids.map((i) => L.y[i]),
    customdata: ids.map((i) => L.hover[i]), marker,
    hovertemplate: "<b>%{customdata[0]}</b><br>%{customdata[1]} · %{customdata[2]}%{customdata[3]}<extra></extra>", ...extra,
  });
  const traces = [], add = (ids, marker, extra) => { if (ids.length) traces.push(trace(ids, marker, extra)); };
  add(idx(dim), {size: size * 0.8, color: "#5f5e5a", opacity: 0.45});
  const rest = idx((i) => !dim(i) && !L.curated[i]);
  add(rest, {size, opacity: 0.85, line: {width: 0.6, color: "#fff"}, ...colourOf(rest),
    ...(landColour === "year" ? {showscale: true, colorbar: YEAR_BAR} : {})});
  const cur = idx((i) => !dim(i) && L.curated[i]);
  add(cur, {size: big, opacity: 1, line: {width: 2, color: INK}, ...colourOf(cur)}, {name: "curated"});
  const keep = el._land && el.layout?.xaxis?.range;
  const layout = {
    showlegend: false, hovermode: "closest", dragmode: "pan", uirevision: L.params,
    margin: {l: 10, r: 10, t: 10, b: 10, autoexpand: false},
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    xaxis: {visible: false, range: [...(keep ? el.layout.xaxis.range : E.x)]},
    yaxis: {visible: false, range: [...(keep ? el.layout.yaxis.range : E.y)], scaleanchor: "x"},
    images: [{source: `/landscape.png?map=${landMap()}&v=${LM.version}`, xref: "x", yref: "y", x: E.x[0], y: E.y[1],
              sizex: E.x[1] - E.x[0], sizey: E.y[1] - E.y[0], sizing: "stretch", layer: "below", opacity: LAND_BG_OPACITY}],
    annotations: landAnn,
    hoverlabel: {font: {size: 16, family: FONT, color: INK}, bgcolor: "#fff", bordercolor: "#888"},
  };
  return Plotly.react(el, traces, layout, {responsive: true, displaylogo: false, scrollZoom: true, doubleClick: "reset",
                                           modeBarButtonsToRemove: ["select2d", "lasso2d", "autoScale2d"]})
    .then(() => { wireLand(el); placeLandLabels(); });
}

// Field (or cluster) names at the centre of their human-gene papers; a name that would
// overlap one already placed is left out until you zoom in (all are in the list below).
function placeLandLabels() {
  const el = $("plot"), fl = el?._fullLayout;
  if (!fl?.xaxis?.l2p || !LM) return;
  const xa = fl.xaxis, ya = fl.yaxis, fs = 15, h = fs * 1.6, placed = [], out = [];
  // PubMedBERT: its 40 fields, biggest first. MedEmbed: 780 clusters, too many to name at once, so the 25
  // holding most of the list's papers, most first.
  const mine = landMap() === "medembed", have = new Map();
  if (mine) for (const f of L.f) have.set(f, (have.get(f) || 0) + 1);
  const top = new Set([...have].filter(([f]) => f > 0).sort((a, b) => b[1] - a[1]).slice(0, 25).map(([f]) => f));
  const fields = LM.fields.filter((f) => f.id > 0 && f.x != null &&
      (landFocus >= 0 ? f.id === landFocus : mine ? top.has(f.id) : f.n >= 1000))
    .sort((a, b) => mine ? have.get(b.id) - have.get(a.id) : b.n - a.n);
  for (const f of fields) {
    const px = xa._offset + xa.l2p(f.x), py = ya._offset + ya.l2p(f.y), w = textWidth(f.name, fs) + 16;
    const b = {x0: px - w / 2, x1: px + w / 2, y0: py - h / 2, y1: py + h / 2};
    if (b.x0 < xa._offset || b.x1 > xa._offset + xa._length || b.y0 < ya._offset || b.y1 > ya._offset + ya._length) continue;
    if (placed.some((o) => b.x0 < o.x1 && o.x0 < b.x1 && b.y0 < o.y1 && o.y0 < b.y1)) continue;
    placed.push(b);
    out.push({x: f.x, y: f.y, text: pesc(f.name), showarrow: false, font: {size: fs, color: INK, family: FONT},
      bgcolor: "rgba(255,255,255,0.85)", bordercolor: f.colour, borderwidth: 2, borderpad: 3, opacity: 0.9});
  }
  landAnn = out;
  Plotly.relayout(el, {annotations: out});
}

function wireLand(el) {  // once per plot element
  if (el._land) return;
  el._land = true;
  let resizing = 0;
  el.on("plotly_relayout", (e) => {  // zoom/pan: re-place the names; zoom: resize the dots
    if ("annotations" in e || el.classList.contains("stale")) return;
    const E = LM.extent, r = el.layout.xaxis.range;
    const k = Math.min(4, Math.max(1, Math.sqrt((E.x[1] - E.x[0]) / Math.abs(r[1] - r[0]))));
    placeLandLabels();
    if (Math.abs(k - landZoom) > 0.05) { landZoom = k; clearTimeout(resizing); resizing = setTimeout(drawLand, 120); }
  });
  wireDotClick(el, (ev) => ev.points[0].customdata[4]);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && isLand() && landFocus >= 0 && !document.querySelector("#how:popover-open")) setLandFocus(-1);
});

// ---- wiring
// Scrolling to the results must not hide their top under the sticky header: --head, the room the results' parts keep
// above them when scrolled to (scroll-margin). (Not scroll-padding on the page: the header's own boxes would sit in
// that band, and the browser scrolled the page at each key typed in them.)
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--head", `${e.target.offsetHeight + 8}px`))
  .observe(document.querySelector("header"));
$("f").onsubmit = (e) => {
  e.preventDefault();
  document.activeElement?.blur();
  const text = $("subject").value.trim(), q = $("term").value.trim();
  const same = G && G.kind === MODE && [S[MODE], G.label].some((t) => t.toUpperCase() === text.toUpperCase());
  S = {...S, gene: "", disease: "", [MODE]: same ? S[MODE] : text, q, rank: $("rank").value, page: 1, sort: "", match: "", topic: "", pmid: ""};
  clearTimeout(yearTimer);
  listTop = true;  // (a new search: its results from the top)
  if (same) { renderDiseases(); show(); }
  else { Object.assign(S, {ot: "", ep: "", named: "", ymin: "", ymax: ""}); searchGene(); }
};
$("rank").onchange = () => {  // keyword ranking lists only papers with the words; the others list all
  S.rank = $("rank").value; S.page = 1; S.sort = ""; S.topic = "";
  listTop = true;
  if (G) { renderDiseases(); show(); }
};
const typing = () => !!document.activeElement?.matches("textarea, input:not([type=range])");
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !typing()) {
    e.preventDefault(); $("subject").focus({preventScroll: true}); $("subject").select();
  }
  if (!isMap() || !M) return;
  if (e.key === "Escape" && !document.querySelector("#how:popover-open")) {  // Esc: drop the picked topic, else stop playing
    if (mapFocus || hoverFocus) { hoverFocus = 0; setFocus(0); }
    else if (playing) { playing = false; syncYear(); }
  }
  if (e.key === "Shift" && !typing() && lastHoverC && lastHoverC !== hoverFocus) { hoverFocus = lastHoverC; drawMap(); }  // Shift: pick out the hovered topic
});
document.addEventListener("keydown", (e) => { if (e.key === "Shift") shiftHeld = true; }, true);
let byKeys = false;  // the last input was a key, not the mouse (inputs match :focus-visible on a click as well)
addEventListener("keydown", () => { byKeys = true; }, true);
addEventListener("pointerdown", () => { byKeys = false; }, true);
document.addEventListener("focusin", (e) => {  // keyboard focus moved under the sticky header: show it
  const head = document.querySelector("header").getBoundingClientRect().bottom, top = e.target.getBoundingClientRect().top;
  if (byKeys && top < head && !e.target.closest("header, [popover]")) scrollBy(0, top - head - 8);
});
const shiftUp = () => {
  shiftHeld = false;
  if (hoverFocus && M) { hoverFocus = 0; drawMap(); }
};
document.addEventListener("keyup", (e) => { if (e.key === "Shift") shiftUp(); });
window.addEventListener("blur", shiftUp);
$("creamBtn").onclick = () => {
  document.body.classList.toggle("cream");
  try { localStorage.setItem("cream", document.body.classList.contains("cream") ? "1" : ""); } catch {}  // (blocked: not kept)
};
try { if (localStorage.getItem("cream")) document.body.classList.add("cream"); } catch {}  // (storage blocked: plain)

let fromNo = 0;  // the newest fromURL (a quick second Back supersedes the first)
async function fromURL() {
  const me = ++fromNo;
  clearTimeout(yearTimer);
  // (read first: drawing can clamp the scroll, and that is saved too)
  const y = restoreY = fromLink ? null : PLACES[history.state?.id] ?? history.state?.y ?? null;
  readURL();
  showMode();
  $("subject").value = S[MODE]; $("term").value = S.q; $("rank").value = S.rank;
  const drawn = S[MODE] ? await searchGene(false) : (clearGene(), $("subject").focus(), true);
  if (me !== fromNo) return;
  if (drawn && restoreY === y) placeBack();  // (unless the user moved on meanwhile)
  restoreY = null;
}
let fromLink = freshLink;  // a link opened: not a reload (which has its place), nor Back or Forward
window.addEventListener("popstate", fromURL);
fromURL().finally(() => { fromLink = false; });
</script>
</body>
