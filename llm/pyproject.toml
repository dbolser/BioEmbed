[project]
name = "bioembed-llm"
version = "0.1.0"
description = "LLM-side evaluation of the BioEmbed benchmark tasks, driven by the vendored embedders-dilemma llm_judge framework"
requires-python = ">=3.12"
# Same main dependency list as vendor/embedders-dilemma/pyproject.toml
# (rlms resolves fine on 3.12, so it is kept; llm_judge only imports it
# lazily when settings.use_rlm is true anyway).
dependencies = [
    "aiofiles>=24.1.0",
    "datasets>=4.4.1",
    "google-auth>=2.38.0",
    "mteb==2.6.5",
    "openai>=2.8.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "rlms>=0.1.1",
    "tqdm>=4.67.1",
]

[tool.uv]
package = false
