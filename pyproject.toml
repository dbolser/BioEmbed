[project]
name = "bioembed"
version = "0.1.0"
description = "Cost-aware comparison of LLMs vs embedding models on biological text (recreating The Embedder's Dilemma for biology)"
readme = "README.md"
authors = [{ name = "Dan Bolser", email = "dan.bolser@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "mteb>=1.36",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "datasets>=2.20",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "duckdb>=1.5.5",
]

[project.scripts]
bioembed = "bioembed:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
